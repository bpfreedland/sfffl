<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SFFFL Draft 2026</title>
<style>
/* Navy and antique gold — the league's own colours, same as the polos.
   Broadcast is a dark field meant to be read across a room on a shared screen;
   Command is light because it is a desk, not a show. */
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap');
:root{
  --navy:#16283C; --deep:#0C1826; --slate:#22384F;
  --gold:#A98A4B; --gold-lt:#D9BE84; --parch:#F2EDE1; --dim:#8195A8;
  --QB:#7C5CB0; --RB:#3E8E6E; --WR:#C4634A; --TE:#3E8EA8; --K:#C79A3A;
  --disp:"Barlow Condensed",'Haettenschweiler','Arial Narrow',sans-serif;
  --body:"Barlow",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 var(--body);background:var(--parch);color:var(--navy)}
body.bcast{background:var(--deep);color:var(--parch)}
.bar{display:flex;align-items:baseline;gap:14px;padding:9px 20px;
  background:var(--navy);color:var(--parch);border-bottom:2px solid var(--gold)}
.bar b{font:700 20px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase}
.bar .sp{margin-left:auto;font-size:12px;color:var(--dim)}
.flip{font:600 11px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;
  background:transparent;color:var(--gold-lt);border:1px solid var(--gold);
  padding:5px 10px;border-radius:4px;margin-left:auto}
#viewname{font:600 12px/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold-lt)}
.ver{font:600 11px/1 var(--disp);letter-spacing:.14em;color:var(--dim);
  border:1px solid var(--slate);padding:4px 7px;border-radius:3px}
.wrap{padding:16px 20px;max-width:1500px;margin:0 auto}
.card{background:#fff;border:1px solid #E0D9CB;border-radius:10px;padding:14px;margin-bottom:14px}
.bcast .card{background:var(--navy);border:1px solid var(--slate);border-radius:6px}
h2{font:600 14px/1 var(--disp);letter-spacing:.18em;text-transform:uppercase;
  color:var(--gold);margin:0 0 10px}
.bcast h2{color:var(--gold-lt)}
/* ---- hero: the pick that just landed ---- */
.hero{display:grid;grid-template-columns:1fr 300px;gap:14px}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.name{font:700 76px/.95 var(--disp);letter-spacing:-.005em;margin:2px 0 8px;
  text-transform:uppercase}
.meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  font:500 19px/1 var(--body);color:var(--dim)}
.pos{font:700 12px/1 var(--disp);letter-spacing:.1em;color:#fff;padding:4px 8px;border-radius:3px}
.verdict{font:700 40px/1 var(--disp);letter-spacing:.03em}
.steal{color:#5FCB98}.reach{color:#E58B72}.market{color:var(--dim)}
.clockname{font:700 40px/1.05 var(--disp);text-transform:uppercase;color:var(--parch)}
.eyebrow{font:600 11px/1 var(--disp);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
/* ---- the ribbon ---- */
.ribwrap{position:relative}
svg.rib{width:100%;height:230px;display:block}
.riblab{font:600 12px/1 var(--body)}
.ribpct{font:700 15px/1 var(--disp)}
.baseline{stroke:var(--gold);stroke-width:1;stroke-dasharray:3 4;opacity:.55}
/* ---- board ---- */
.grid{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
.grid th{font:600 13px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);padding:6px 3px;border-bottom:1px solid var(--slate);text-align:left}
.card .grid th{border-bottom-color:#E0D9CB}
.grid td{border:1px solid #EFEAE0;padding:3px;height:44px;vertical-align:top;
  overflow:hidden;white-space:nowrap}
.slotf,.slot0{padding:3px 4px;border-radius:3px;margin-bottom:2px;overflow:hidden;
  text-overflow:ellipsis}
.slotf:last-child,.slot0:last-child{margin-bottom:0}
.slot0{opacity:.45}
.pn{float:right;font-size:10px;color:var(--dim);margin-left:4px}
.grid td.twin{background:rgba(169,138,75,.10)}
.slotf.pQB{background:rgba(124,92,176,.18)}
.slotf.pRB{background:rgba(62,142,110,.18)}
.slotf.pWR{background:rgba(196,99,74,.18)}
.slotf.pTE{background:rgba(62,142,168,.18)}
.slotf.pK {background:rgba(199,154,58,.18)}
.bcast .slotf.pQB{background:rgba(124,92,176,.34)}
.bcast .slotf.pRB{background:rgba(62,142,110,.34)}
.bcast .slotf.pWR{background:rgba(196,99,74,.34)}
.bcast .slotf.pTE{background:rgba(62,142,168,.34)}
.bcast .slotf.pK {background:rgba(199,154,58,.34)}
.bcast .grid td{border-color:#1B3049}
col.cRd{width:26px}
.grid th.rd{text-align:center;color:var(--dim);padding:0}
.grid td.pK {background:rgba(199,154,58,.16)}
.bcast .grid td.pK {background:rgba(199,154,58,.30)}
.blocked{margin-top:10px;padding:9px 11px;border-left:3px solid #B05A44;
  background:#FBF0EE;color:#8C3A2B;font-size:14px;border-radius:0 4px 4px 0}
.blocked button{margin-left:8px;padding:4px 9px;font-size:12px}
.grid td.mine{background:#F4F7F4}
.bcast .grid td.mine{background:#16304A}
.grid td.now{outline:2px solid var(--gold);outline-offset:-2px}
.nm{font-weight:600}
.sub{color:var(--dim);font-size:13px}
/* ---- command ---- */
input[type=text]{width:100%;padding:12px 14px;font:500 17px var(--body);
  border:1px solid #E0D9CB;border-radius:8px;background:var(--parch);color:var(--navy)}
input:focus-visible,button:focus-visible,li:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{font:600 14px var(--body);padding:9px 15px;border:1px solid #E0D9CB;
  border-radius:8px;background:#fff;cursor:pointer;color:var(--navy)}
button.primary{background:var(--navy);color:var(--parch);border-color:var(--navy)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
ul.sug{list-style:none;margin:8px 0 0;padding:0;max-height:280px;overflow:auto}
ul.sug li{padding:9px 11px;border:1px solid #E0D9CB;border-radius:8px;margin-bottom:6px;
  cursor:pointer;display:flex;gap:9px;align-items:center}
ul.sug li.on{border-color:var(--navy);background:#EEF2F6}
.tag{display:inline-block;font-size:16px;padding:5px 11px;border-radius:99px;
  border:1px solid #E0D9CB;color:var(--dim);margin:0 5px 5px 0}
.bcast .tag{border-color:var(--slate);color:var(--parch)}
.tag.tgt{border-color:var(--gold);color:#7A6231;background:#FBF6EA}
.tag.dnd{border-color:#B05A44;color:#B05A44;background:#FBF0EE}
.gate{max-width:340px;margin:70px auto;text-align:center}
.fade{animation:f .45s cubic-bezier(.2,.7,.3,1)}
@keyframes f{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.split{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.rcrow{display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid var(--slate)}
.rcblock + .rcblock{margin-top:14px;padding-top:12px;border-top:1px solid var(--slate)}
.rcblock.prior{opacity:.62}
.rchead{font:700 12px var(--disp);letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);margin-bottom:4px}
.rcblock.prior .rchead{color:var(--dim)}
.rclab{font:700 10px var(--disp);letter-spacing:.14em;width:44px;color:var(--dim)}
.grade.sm{font-size:22px;padding:0}
.rcname{font-weight:600}
.rcwho{margin-left:auto;font:600 11px var(--disp);letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim)}
.rcsay{margin-top:11px;font-size:16px;line-height:1.4}
.rcsay.ai{color:var(--gold-lt);font-style:italic}
@media(max-width:1100px){.split{grid-template-columns:1fr}}
.split3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:980px){.split3{grid-template-columns:1fr}}
table.lineup,table.counts{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.lineup td,table.counts td,table.counts th{padding:5px 4px;border-bottom:1px solid #EFEAE0}
table.counts th{font:600 10px var(--disp);letter-spacing:.1em;color:var(--dim);text-align:right}
table.counts th:first-child{text-align:left}
table.counts td{text-align:right}table.counts td:first-child{text-align:left}
td.slot{font:700 11px var(--disp);letter-spacing:.1em;color:var(--dim);width:46px}
td.empty{color:#B9B1A2;font-style:italic}
tr.me td{font-weight:600}
td.met{color:#3E8E6E}td.short{color:#B05A44}
.grade{font:700 34px/1 var(--disp);letter-spacing:.02em;padding:0 4px}
.gA{color:#5FCB98}.gB{color:var(--gold-lt)}.gC{color:#E0A46B}.gF{color:#E58B72}
h2.hInstant{color:var(--dim)}
h2.hAI{color:var(--gold-lt)}
.incoming{margin-left:12px;color:var(--gold);font-style:italic;text-transform:none;
  letter-spacing:.02em;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.say.ai{color:var(--gold-lt);font-style:italic}
.caret{color:var(--gold-lt);animation:blink 1s step-end infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.grade{font:700 34px/1 var(--disp);letter-spacing:.02em;padding:0 4px}
.gA{color:#5FCB98}.gB{color:var(--gold-lt)}.gC{color:#E0A46B}.gF{color:#E58B72}
h2.hInstant{color:var(--dim)}
h2.hAI{color:var(--gold-lt)}
.incoming{margin-left:12px;color:var(--gold);font-style:italic;text-transform:none;
  letter-spacing:.02em;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.say.ai{color:var(--gold-lt);font-style:italic}
.caret{animation:none;display:none}}
.livedot{margin-left:9px;font:600 10px var(--disp);letter-spacing:.14em;
  color:var(--deep);background:var(--gold-lt);padding:3px 6px;border-radius:3px}
.addbox{margin-top:10px;padding:10px;border:1px dashed var(--gold);
  border-radius:6px;background:#FBF6EA}
button.addpos{font:700 13px var(--disp);letter-spacing:.08em}
table.odds tr.wait td{opacity:.42}
.warn{margin-top:10px;padding:8px 10px;border-left:3px solid #B05A44;
  background:#FBF0EE;color:#8C3A2B;font-size:13px;border-radius:0 4px 4px 0}
table.odds{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.odds td{padding:8px 5px;font-size:18px;border-bottom:1px solid var(--slate)}
.bcast table.odds tr.me td{color:var(--gold-lt);font-weight:600}
td.rk{width:28px;color:var(--dim);font:600 15px var(--disp)}
td.pc{text-align:right;font:700 24px var(--disp);width:82px}
td.ml{text-align:right;font:700 26px var(--disp);width:86px;letter-spacing:.01em}
td.pcs{text-align:right;font-size:13px;color:var(--dim);width:52px;
  font-variant-numeric:tabular-nums}
.bcast table.odds tr.me td.ml{color:var(--gold-lt)}
td.dl{text-align:right;width:74px;font-size:15px}
.up{color:#5FCB98}.dn{color:#E58B72}.flat{color:var(--dim)}
.say{font:500 27px/1.4 var(--body)}
.note{margin-top:12px;color:var(--dim);font-size:18px;
  border-left:2px solid var(--gold);padding-left:10px}
@media(max-width:820px){.split{grid-template-columns:1fr}}
@media(max-width:700px){
  .wrap{padding:12px}
  .name{font-size:34px}
  .verdict{font-size:22px}
  .clockname{font-size:22px}
  svg.rib{height:190px}
  .grid{display:none}
  .recent{display:block}
}
.recent{display:none;list-style:none;margin:0;padding:0}
.recent li{display:flex;gap:9px;align-items:center;padding:7px 0;
  border-bottom:1px solid var(--slate)}
.recent .who{margin-left:auto;font:600 11px/1 var(--disp);letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim)}
@media(prefers-reduced-motion:reduce){.fade{animation:none}
  svg.rib *{transition:none!important}}
</style>
</head>

/* Every state change bumps a revision, and nothing is ever adopted unless its
   revision is HIGHER than what this window already has. Without that rule any
   stale participant — an old tab left open from an earlier build, a slow
   message, a storage echo — can push the draft backwards for a few seconds
   until the next real change puts it right. Which is exactly what it looked
   like when it happened.

   Messages are also stamped with the build. Two windows only talk if they are
   running the same version of this page. */
function save(broadcast) {
  ST.rev = (ST.rev || 0) + 1;
  try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {}
  if (broadcast && chan) chan.postMessage({ st: ST, build: BUILD, from: VIEW });
  flag();
}

/** Take the incoming state only if it is genuinely newer. */
function adopt(next, why) {
  if (!next || typeof next !== "object") return false;
  const mine = ST.rev || 0, theirs = next.rev || 0;
  if (theirs <= mine && Object.keys(ST.made || {}).length) {
    stale.push(why + " rev " + theirs + " <= " + mine);
    if (stale.length > 6) stale.shift();
    return false;
  }
  const hadPicks = Object.keys(ST.made || {}).length;
  ST = Object.assign({ made:{}, targets:{}, note:{} }, next);
  syncCustom();
  render();
  if (Object.keys(ST.made).length !== hadPicks) computeOdds(render);
  return true;
}
let stale = [];

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed.rev == null) parsed.rev = 1;          // state from an older build
    if ((parsed.rev || 0) > (ST.rev || 0) || !Object.keys(ST.made || {}).length) {
      ST = Object.assign({ made:{}, targets:{}, note:{} }, parsed);
    }
    syncCustom();
  } catch (e) {}
}

  if (!e.data || !e.data.st) return;
  if (e.data.build !== BUILD) {                      // a tab on an older build
    stale.push("build " + (e.data.build || "?"));
    if (stale.length > 6) stale.shift();
    return;
  }
  adopt(e.data.st, "channel");

  // rewriting it fires a storage event straight back at the sender

/* iOS suspends background tabs, so a BroadcastChannel message sent while this

   foreground. This is also what makes it testable on a phone: flip tabs and
   the other view has caught up. */
function resync() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed.rev == null) parsed.rev = 1;
    if (adopt(parsed, "resync")) flag();

    and not what anyone watching is picturing. */
function consensusAvail(n) {
  return available().sort((a, b) => a.adp - b.adp).slice(0, n);

  // VOR, not raw points. Kickers outscore everyone and are worth almost

    if (q.n === p.n || q.adp >= p.adp) continue;
    if (KEPT.has(q.n)) { ahead++; continue; }
    if (before == null) { if (taken().has(q.n)) ahead++; continue; }
    for (const o in ST.made) {
      if (ST.made[o] === q.n && +o < before) { ahead++; break; }

function delta(name, overall) {
  const p = BY[name]; if (!p) return 0;
  return Math.round(overall - marketSlot(p, overall));

/** One plausible completion of the draft.

    still unknown on draft night.

function sampleRosters(rnd) {
  const rost = {}, t = new Set();
  DATA.owners.forEach(o => {

    if (nm && !t.has(nm)) { rost[pk.w].push(nm); t.add(nm); }

      if (c[p.p] < STARTERS[p.p]) s += 30;
      else if (c[p.p] < LIMIT[p.p][0]) s += 6;

      s += -NOISE * Math.log(-Math.log(Math.max(1e-9, rnd())));

}

  const kept = {};
  DATA.owners.forEach(o => kept[o] = (DATA.keepers[o] || []).length);
  DATA.picks.forEach(pk => {

    const i = kept[pk.w] + idx[pk.w];
    if (i < lst.length) { seq.push([pk.o, lst[i]]); idx[pk.w]++; }

  });
  const score = (o, wk) => {
    const by = { QB:[], RB:[], WR:[], TE:[], K:[] };
    for (const pl of rr[o]) {
      if (wk !== null && DATA.bye[pl.team] === wk + 1) continue;
      if (wk !== null && rnd() > AVAIL) continue;
      let s = 0;
      for (const e of pl.ev) s += e[0] * pois(e[1], rnd);
      by[pl.pos].push(s);
    }
    POS.forEach(q => by[q].sort((a, b) => b - a));
    let tot = 0;
    const used = { QB:1, RB:2, WR:2, TE:1, K:1 };
    for (const q of POS) for (let i = 0; i < used[q]; i++) tot += by[q][i] || 0;
    let flex = 0;
    ["RB","WR","TE"].forEach(q => {
      const extra = by[q][used[q]] || 0;
      if (extra > flex) flex = extra;
    });
    return tot + flex;
  };
  const wins = {}, pf = {};
  DATA.owners.forEach(o => { wins[o] = 0; pf[o] = 0; });
  for (let wk = 0; wk < 14; wk++) {
    const wkScore = {};
    DATA.owners.forEach(o => wkScore[o] = score(o, wk));
    for (const g of DATA.schedule[wk]) {
      const a = wkScore[g[0]], b = wkScore[g[1]];
      pf[g[0]] += a; pf[g[1]] += b;
      if (a > b) wins[g[0]]++; else if (b > a) wins[g[1]]++;
      else { wins[g[0]] += 0.5; wins[g[1]] += 0.5; }
    }
  }
  const order = DATA.owners.slice().sort((x, y) =>
    (wins[y] - wins[x]) || (pf[y] - pf[x]));
  /* Top TWO from each division qualify, crossed in the semis: each division
     champion plays the other division's runner-up. So the final can be an
     intra-division rematch, and — the part that actually moves the numbers —
     qualification is by division standing, not overall record. Third in a
     stacked division misses while second in a soft one gets in. */
  const byDiv = {};
  order.forEach(o => { (byDiv[DATA.div[o]] = byDiv[DATA.div[o]] || []).push(o); });
  const divs = Object.keys(byDiv);
  const A = byDiv[divs[0]], B = byDiv[divs[1]];
  const play = (x, y) => {
    const a = score(x, null), b = score(y, null);
    return a === b ? (pf[x] > pf[y] ? x : y) : (a > b ? x : y);
  };
  const champ = play(play(A[0], B[1]), play(B[0], A[1]));
  return { champ: champ, top: order[0] };
}

/* sliced runner ------------------------------------------------------- */
let ODDS = {}, oddsRun = 0, oddsBusy = false;
DATA.owners.forEach(o => ODDS[o] = 10);
let RIBBON = [];   // history: one snapshot per completed pick

function computeOdds(done) {
  const myRun = ++oddsRun;
  const samples = rosterSamples(mulberry32(0xA11CE), 35);
  /* Common random numbers: the SAME draws every recompute. Without this, one
     pick moves the odds by less than the Monte Carlo noise and the ribbon
     jitters for no reason. With it, movement is the roster change. */
  const rnd = mulberry32(0x5FFF1);
  const tally = {}; DATA.owners.forEach(o => tally[o] = 0);
  let n = 0;
  oddsBusy = true;
  (function slice() {
    // A newer pick supersedes this run — except for the very first one, which
    // has to finish or there is no baseline to measure pick 1 against.
    if (myRun !== oddsRun && RIBBON.length) return;
    const end = Math.min(n + 40, SEASONS);
    for (; n < end; n++) tally[oneSeason(samples[n % samples.length], rnd).champ]++;
    if (n < SEASONS) return setTimeout(slice, 0);
    DATA.owners.forEach(o => ODDS[o] = 100 * tally[o] / SEASONS);
    oddsBusy = false;
    const pc = Object.keys(ST.made).length;
    const tail = RIBBON[RIBBON.length - 1];
    if (tail && tail.pick === pc) tail.odds = Object.assign({}, ODDS);
    else RIBBON.push({ pick: pc, odds: Object.assign({}, ODDS) });
    if (done) done();
  })();
}


/* ------------------------------------------------------- commentary
   Written in advance, assembled live. The specificity comes from facts the
   page computes at the moment of the pick — how far he fell, what hole it
   fills, whether a run is on — not from the phrasing. Lines punch at the
   pick, never at the person: nine friends are reading this on a shared
   screen and nobody vets it first.

   Deterministic: the same pick always produces the same line, so a re-render
   never reshuffles the joke mid-sentence. */
function seedOf(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h;
}
const pickFrom = (arr, seed) => arr[(seed >>> 3) % arr.length];

const PRAISE_STEAL = [
  "Nobody moved on him for {d} picks. That is a bargain.",
  "The board said {adp}. The room said nothing. Good patience.",
  "Sat there {d} spots past his slot. Somebody was paying attention.",
  "That is the pick of the round so far, and it was not close.",
  "Waited him out and got him. Well played.",
  "Everyone had a chance at him for {d} picks. One person took it.",
  "{d} spots of value, collected quietly."
];
const PRAISE_NEED = [
  "Fills the {pos} hole without reaching to do it. Clean.",
  "Needed a {pos}, took the best one left. No cleverness required.",
  "That roster was thin at {pos}. It isn't now."
];
const PRAISE_VALUE = [
  "Straight down the middle. Nothing to argue with.",
  "Fair, sensible, hard to argue with.",
  "The obvious pick, made without fuss."
];
const SNARK_REACH = [
  "Reached {r} spots. He was not going anywhere.",
  "{r} picks early. Bold, and possibly unnecessary.",
  "Nobody else was close to taking him. Someone is confident.",
  "Nobody was taking him. Nobody at all.",
  "That is a statement, and not a quiet one.",
  "Taken {r} spots early, with nobody bidding.",
  "There was no pressure here. None whatsoever.",
  "{r} ahead of the board. Conviction, or a list read upside down."
];
const SNARK_RUN = [
  "That's {c} {pos}s in the last {n} picks. The run is on.",
  "Fourth {pos} in short order — everyone has noticed the same thing at once.",
  "{c} {pos}s off the board in {n} picks. Panic is contagious."
];
const SNARK_K = [
  "A kicker. In round {rd}. There are {left} startable players left.",
  "Kicker number {c} off the board. Round {rd}. Remarkable.",
  "The kicker run has begun, {rds} ahead of schedule."
];
const NOTE_LEAD = ["Worth knowing:", "For the record:", "Context:", "The file says:"];

function positionRun(overall, pos, span) {
  let c = 0;
  for (let o = Math.max(1, overall - span + 1); o <= overall; o++) {
    const n = ST.made[o]; if (n && BY[n] && BY[n].p === pos) c++;
  }
  return c;
}
function ownerCounts(o) {
  const c = { QB:0, RB:0, WR:0, TE:0, K:0 };
  (DATA.keepers[o] || []).forEach(n => { if (BY[n]) c[BY[n].p]++; });
  DATA.picks.forEach(pk => {
    if (pk.w === o && ST.made[pk.o] && BY[ST.made[pk.o]]) c[BY[ST.made[pk.o]].p]++;
  });
  return c;
}

/** Returns {verdict, line, note} for the pick at `overall`. */
function commentary(overall) {
  const nm = ST.made[overall]; if (!nm) return null;
  const p = BY[nm]; if (!p) return null;
  const pk = DATA.picks.find(x => x.o === overall);
  const d = delta(nm, overall);
  const seed = seedOf(nm + ":" + overall);
  const before = ownerCounts(pk.w);           // includes this pick
  const run = positionRun(overall, p.p, 6);
  const slot = marketSlot(p, overall);
  const fill = { d: d, r: -d, adp: slot, o: overall, pos: p.p, rd: pk.r,
                 c: run, n: 6, left: available().length };
  fill.rds = pk.r === 1 ? "a round" : pk.r + " rounds";
  const put = t => t.replace(/\{(\w+)\}/g, (_, k) => fill[k]);

  let verdict, line;
  if (p.p === "K" && pk.r <= 9) {
    verdict = "KICKER";
    fill.c = ownerCountsAll("K");
    line = put(pickFrom(SNARK_K, seed));
  } else if (d <= -9) {
    verdict = "REACHED " + (-d);
    line = put(pickFrom(SNARK_REACH, seed));
  } else if (run >= 4) {
    verdict = "RUN ON " + p.p;
    line = put(pickFrom(SNARK_RUN, seed));
  } else if (d >= 10) {
    verdict = "FELL " + d;
    line = put(pickFrom(PRAISE_STEAL, seed));
  } else if (before[p.p] <= 2 && (p.p === "RB" || p.p === "WR" || p.p === "TE")) {
    verdict = "FILLS A NEED";
    line = put(pickFrom(PRAISE_NEED, seed));
  } else {
    verdict = "AT MARKET";
    line = put(pickFrom(PRAISE_VALUE, seed));
  }
  const note = p.note ? pickFrom(NOTE_LEAD, seed) + " " + p.note + "." : "";
  return { verdict: verdict, line: line, note: note, delta: d };
}
function ownerCountsAll(pos) {
  let c = 0;
  Object.values(ST.made).forEach(n => { if (BY[n] && BY[n].p === pos) c++; });
  return c;
}


/* --------------------------------------------------------------- the wire
   Live commentary from Sonnet. Only Command holds the key — it makes the
   call, writes the line into shared state, and Broadcast displays whatever
   arrives. If there is no key, no network, or the call is slow, the written
   templates fill the gap and nothing on screen looks broken.

   The static half of the prompt (rules, league history, guardrails) is sent
   as a cached system block, so 120 picks cost pennies instead of dollars. */
const AKEY = "sfffl-api-key";
const MODEL = "claude-sonnet-4-6";
const WIRE_TIMEOUT = 9000;

function apiKey() { try { return localStorage.getItem(AKEY) || ""; } catch (e) { return ""; } }
function setApiKey(k) {

}

function loreBlock() {

function wpct(rec) {
  const p = String(rec).split("-").map(Number);
  const g = (p[0] || 0) + (p[1] || 0) + (p[2] || 0);
  return g ? (p[0] + 0.5 * (p[2] || 0)) / g : 0.5;
}

/** A specific fact from the 24-year record, rotated so the same owner does not
    produce the same line twice in a night. These are the deep cuts. */
function deepCut(o, salt) {
  const l = (DATA.lore || {})[o] || {}, lg = (DATA.lore || {})._league || {};
  const c = [];
  if (l.titles && l.titles.length)
    c.push(o + " has won it in " + l.titles.join(", ") + ".");
  if (l.drought > 5) c.push(o + " has not won since " + (2025 - l.drought) + " — " + l.drought + " years.");
  if (l.drought === 0) c.push(o + " is the defending champion.");
  if (l.titles && !l.titles.length) c.push(o + " has never won this league. " + lg.seasons + " seasons.");
  if (l.runnerUp && l.runnerUp.length)
    c.push(o + " has lost the final " + l.runnerUp.length + " time" + (l.runnerUp.length > 1 ? "s" : "")
      + " (" + l.runnerUp.join(", ") + ").");
  if (l.coty && l.coty.length) c.push(o + " was coach of the year in " + l.coty.join(", ") + ".");
  if (l.money) c.push(o + " has taken " + l.money + " out of this league over " + l.cashes + " cashes.");
  if (l.owns) c.push(o + " owns " + l.owns[0] + " head to head, " + l.owns[1] + ".");
  if (l.ownedBy) c.push(l.ownedBy[0] + " owns " + o + " head to head, " + l.ownedBy[1] + ".");
  if (l.rec) c.push(o + " is " + l.rec + " all time.");
  c.push("Only one owner has ever gone back to back in "
    + lg.seasons + " seasons: " + (lg.repeats || []).map(r => r[0] + ", in "
    + (r[1] - 1) + " and " + r[1]).join(", ")
    + ". The current champion is " + lg.lastChamp + ".");
  return c.length ? c[(seedOf(o + ":" + salt) >>> 5) % c.length] : "";
}


/** VERIFIED DRAFT TRIVIA.
    Seven years of real drafts, reconciled from ESPN recaps against Craig's own
    sheets. Each entry is a finished sentence with the count already computed;
    the model never sees the underlying table and is never asked to derive a
    number from draft history.

    Conditions on each fact (`c`) decide whether it may fire on THIS pick:
      own    the owner picking must be the fact's owner
      notown the owner picking must NOT be the fact's owner
      maxr   this pick must be within the owner's first N picks
      pos    this pick must be at this position
    The own/notown split exists because a count changes the instant the same
    owner takes the same player again. "Craig has drafted Tucker three times"
    becomes false at the moment Craig drafts him a fourth. */
function triviaFor(overall) {
  const T = (DATA.trivia || {}).facts || [];
  if (!T.length) return null;
  const pk = DATA.picks.find(x => x.o === overall);
  const nm = ST.made[overall], p = BY[nm];
  if (!pk || !p) return null;
  const mine = DATA.picks.filter(x => x.w === pk.w && ST.made[x.o])
    .map(x => x.o).sort((a, b) => a - b);
  const seq = mine.indexOf(overall) + 1;      // this owner's Nth pick tonight
  const ok = T.filter(f => {
    if (f.p.length && f.p.indexOf(nm) < 0) return false;
    if (f.c.own && f.o.indexOf(pk.w) < 0) return false;
    if (f.c.notown && f.o.indexOf(pk.w) >= 0) return false;
    if (f.c.maxr && !(seq && seq <= f.c.maxr)) return false;
    if (f.c.pos && f.c.pos !== p.p) return false;
    if (!f.p.length && !f.o.length && !f.c.pos) return false;  // too generic
    return true;
  });
  if (!ok.length) return null;
  // player-specific beats owner-specific beats league-wide, then rotate
  const rank = f => (f.p.length ? 0 : f.o.length ? 1 : 2);
  ok.sort((a, b) => rank(a) - rank(b));
  const best = ok.filter(f => rank(f) === rank(ok[0]));
  return best[(seedOf(nm + ":" + overall) >>> 3) % best.length].t;
}

/** Is this pick dull? Dull picks are where the trivia goes. */
function isRoutine(overall) {
  const nm = ST.made[overall], p = BY[nm];
  if (!p) return true;
  const d = Math.abs(delta(nm, overall));
  return d < 8 && positionRun(overall, p.p, 6) < 4 && p.p !== "K";

  L.push("Market slot here was " + slot + ", so he went " + (d < 0 ? Math.abs(d)

  if (run >= 3) L.push("That is " + run + " " + p.p + "s in the last six picks.");

  if (p.p === "K") L.push("Kicker number " + ks + " off the board, in round " + pk.r + ".");
  if (Math.abs(mv) >= 0.5) L.push("Title odds for " + pk.w + " moved "
    + (mv > 0 ? "+" : "") + mv.toFixed(1) + " points to " + (ODDS[pk.w] || 0).toFixed(1) + "%.");
  const nextUp = onClock();
  if (nextUp) L.push("On the clock next: " + nextUp.w + ".");

  ST.deep = ST.deep || {};
  const roundDone = !!ST.deep[pk.r];
  const late = (overall % 10) >= 8;
  const triv = triviaFor(overall);
  if (triv) {
    L.push("");
    L.push("DRAFT HISTORY — this is verified from seven years of real drafts. "
      + "Use it as written. Do not adjust the numbers, do not add to it, and "
      + "do not infer anything else about past drafts: " + triv);
  }
  if (!roundDone && (isRoutine(overall) || late)) {
    L.push("");
    L.push((triv ? "ALSO a deep cut" : "DEEP CUT")
      + " — use this, it is the interesting part of this pick: "
      + deepCut(pk.w, pk.r));
    ST.deep[pk.r] = overall;
  } else if (isRoutine(overall) && !triv) {
    L.push("");
    L.push("This pick is unremarkable on its own. Something true and specific is "
      + "better than a forced verdict: " + deepCut(pk.w, overall));
  }
  return L.join("\n");
}

/** One sentence on a completed round. Same voice, same rules, tighter leash. */
function recapFacts(r) {
  const e = roundExtremes(r); if (!e) return null;
  const rows = DATA.picks.filter(x => x.r === r && ST.made[x.o])
    .map(x => x.w + " took " + ST.made[x.o] + " (" + (BY[ST.made[x.o]] || {}).p + ")");
  return ["ROUND " + r + " IS COMPLETE. All ten picks:",
    rows.join("; ") + ".",
    "By position: " + POS.filter(q => e.counts[q]).map(q => e.counts[q] + " " + q).join(", ") + ".",
    "Best value of the round: " + e.best.w + " on " + e.best.n + ".",
    "Worst: " + e.worst.w + " on " + e.worst.n + ".",
    "",
    "Write ONE sentence summarising the round. Not a list, not a recap of every",
    "pick — the single thing that characterised it. Same voice and same rules:",
    "no numbers from the board, third person, no addressing anyone."].join("\n");
}

async function runRecap(r) {
  if (VIEW !== "command" || ST.mute) return;
  if (ST.recap && ST.recap[r]) return;
  const facts = recapFacts(r); if (!facts) return;
  const key = apiKey(); if (!key) return;
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), WIRE_TIMEOUT);
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST", signal: ctl.signal,
      headers: { "content-type": "application/json", "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: MODEL, max_tokens: 120,
        system: [{ type: "text", text: systemPrompt(),
                   cache_control: { type: "ephemeral", ttl: "1h" } }],
        messages: [{ role: "user", content: facts }] })
    });
    clearTimeout(timer);
    if (!res.ok) return;
    const data = await res.json();
    const txt = (data.content || []).filter(b => b.type === "text")
      .map(b => b.text).join(" ").trim();
    if (txt) { ST.recap = ST.recap || {}; ST.recap[r] = txt; save(true); render(); }
  } catch (e) { clearTimeout(timer); }
}

/** Ask Sonnet. Resolves to a string, or null if anything at all goes wrong. */
async function askWire(overall) {
  const key = apiKey();
  if (!key) return null;
  const facts = pickFacts(overall);
  if (!facts) return null;
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), WIRE_TIMEOUT);
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      signal: ctl.signal,
      headers: {
        "content-type": "application/json",
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 180,
        system: [{ type: "text", text: systemPrompt(),
                   cache_control: { type: "ephemeral", ttl: "1h" } }],
        messages: [{ role: "user", content: facts }]
      })
    });
    clearTimeout(timer);
    if (!res.ok) { wireErr = "HTTP " + res.status; return null; }
    const data = await res.json();
    const txt = (data.content || []).filter(b => b.type === "text")
      .map(b => b.text).join(" ").trim();
    wireErr = "";
    return txt || null;
  } catch (e) {
    clearTimeout(timer);
    wireErr = e.name === "AbortError" ? "timed out" : "network error";
    return null;
  }
}

let wireErr = "";
let wireBusy = false;

/** Fetch commentary for a pick and put it in shared state so Broadcast sees it. */
async function runWire(overall, force) {
  if (VIEW !== "command") return;          // only the key holder calls out
  if (ST.mute) return;
  if (!force && ST.wire && ST.wire[overall]) return;
  wireBusy = true;
  ST.pending = overall;          // tells Broadcast that a second pass is coming
  save(true);
  render();
  const txt = await askWire(overall);
  wireBusy = false;
  if (ST.pending === overall) delete ST.pending;
  ST.wire = ST.wire || {};
  if (txt) ST.wire[overall] = txt;
  save(true);
  render();
}

/** What Broadcast shows: the live line if it arrived, else the written one. */
function wireFor(overall) {
  if (ST.wire && ST.wire[overall]) return { text: ST.wire[overall], live: true };
  const c = commentary(overall);
  return c ? { text: c.line + (c.note ? " " + c.note : ""), live: false } : null;
}

async function testWire() {
  const el = document.getElementById("wiretest");
  if (el) el.textContent = "testing…";
  const key = apiKey();
  if (!key) { if (el) el.textContent = "no key saved"; return; }
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "content-type": "application/json", "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: MODEL, max_tokens: 16,
        messages: [{ role: "user", content: "Reply with the single word: ready" }] })
    });
    if (el) el.textContent = res.ok ? "connected — ready for draft night"
      : "failed: HTTP " + res.status + (res.status === 401 ? " (bad key)" : "");
  } catch (e) {
    if (el) el.textContent = "failed: could not reach the API";
  }
}


/* ---------------------------------------------------------------- entry */
let q = "", cursor = 0;
function matches() {
  const s = q.trim().toLowerCase();
  if (!s) return [];
  const t = taken();
  const parts = s.split(/\s+/);
  return draftable().filter(p => {
    if (false) return false;
    const hay = (p.n + " " + p.t + " " + p.p).toLowerCase();
    return parts.every(x => hay.includes(x));
  }).sort((a,b) => a.adp - b.adp).slice(0, 8);
}
/** Players typed in on the night. Kept in shared state so both windows and a
    refresh all agree, and injected into the board so they behave like any
    other pick. */
function syncCustom() {
  const c = ST.custom || {};
  Object.keys(c).forEach(n => {
    if (BY[n]) return;
    const rec = { n: n, p: c[n].p, t: c[n].t || "FA", adp: 250,
                  pts: DATA.repl[c[n].p] || 0, vor: -1, thin: 1, custom: 1 };
    DATA.players.push(rec);
    BY[n] = rec;
    buildShortNames();
  });
}

function addCustom(name, pos, team) {
  name = String(name).trim();
  if (!name || BY[name]) return false;
  ST.custom = ST.custom || {};
  ST.custom[name] = { p: pos, t: (team || "FA").toUpperCase() };
  syncCustom();
  return true;
}

/** Why this owner cannot take this player, or "" if he can. */
function illegalReason(owner, name) {
  const p = BY[name]; if (!p) return "";
  const r = rosterFor(owner);
  if (r.length >= 15) return owner + " already has 15 players";
  const c = { QB:0, RB:0, WR:0, TE:0, K:0 };
  r.forEach(n => { if (BY[n]) c[BY[n].p]++; });
  if (c[p.p] >= LIMIT[p.p][1])
    return owner + " already has " + c[p.p] + " " + p.p + " (max " + LIMIT[p.p][1] + ")";
  if (!roomFor(r, p.p)) {
    const left = 15 - r.length - 1;
    const short = POS.filter(q => (c[q] + (q === p.p ? 1 : 0)) < LIMIT[q][0])
      .map(q => (LIMIT[q][0] - c[q] - (q === p.p ? 1 : 0)) + " " + q);
    return "that leaves " + owner + " short — still needs " + short.join(", ")
      + " with only " + left + " pick" + (left === 1 ? "" : "s") + " left";
  }
  return "";
}

let blockMsg = "";

function commit(name, force) {
  const pk = onClock();
  if (!pk || !name || taken().has(name)) return;
  if (!force) {
    const bad = illegalReason(pk.w, name);
    if (bad) { blockMsg = bad + "."; render(); return; }
  }
  blockMsg = "";
  ST.made[pk.o] = name;
  lastPickSeen = pk.o;
  q = ""; cursor = 0;
  save(true);
  render();
  computeOdds(render);
  runWire(pk.o, false);
  const done = lastCompleteRound();
  if (done) runRecap(done);
}
function undo() {
  const done = Object.keys(ST.made).map(Number).sort((a,b) => a-b);
  if (!done.length) return;
  delete ST.made[done[done.length - 1]];
  save(true);
  render();
}
function toggleTag(name, kind) {
  const cur = ST.targets[name];
  ST.targets[name] = (cur === kind) ? null : kind;
  if (!ST.targets[name]) delete ST.targets[name];
  save(true);
  render();
}

/* ---------------------------------------------------------------- render */
/* Board cells are narrow, so names get abbreviated — but "J. Williams" is both
   Javonte and Jameson, and "J. Love" is both Jeremiyah and Jordan. On a shared
   screen that is worse than a long name. Where an initial collides, keep enough
   of the first name to tell them apart. */
const SHORT = {};
function buildShortNames() {
  const byKey = {};
  DATA.players.forEach(p => {
    const parts = p.n.split(" ");
    if (parts.length < 2) { SHORT[p.n] = p.n; return; }
    const key = parts[0][0] + "|" + parts.slice(1).join(" ");
    (byKey[key] = byKey[key] || []).push(p.n);
  });
  Object.keys(byKey).forEach(key => {
    const group = byKey[key], last = key.split("|")[1];
    group.forEach(full => {
      const first = full.split(" ")[0];
      SHORT[full] = group.length === 1
        ? first[0] + ". " + last
        : first.slice(0, 4) + (first.length > 4 ? "." : "") + " " + last;
    });
  });
}
function shortName(full) {
  if (SHORT[full]) return SHORT[full];
  const parts = String(full).split(" ");
  return parts.length < 2 ? full : parts[0][0] + ". " + parts.slice(1).join(" ");
}
function posChip(p) {
  return '<span class="pos" style="background:var(--' + p + ')">' + p + '</span>';
}
function esc(s) { return String(s).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }

function gridHTML() {
  let h = '<table class="grid"><colgroup><col class="cRd">'
    + DATA.owners.map(() => "<col>").join("") + "</colgroup><tr><th></th>";
  DATA.owners.forEach(o => h += "<th>" + esc(o) + "</th>");
  h += "</tr>";
  const clock = onClock();
  for (let r = 1; r <= 12; r++) {
    h += '<tr><th class="rd">' + r + "</th>";
    DATA.owners.forEach(o => {
      /* Twelve picks have been traded, so an owner can hold two picks in one
         round and none in another. The old grid rendered a single pick per
         owner per round and silently dropped the rest — nine picks invisible,
         including Ben's own back-to-back at 19 and 20. */
      const cell = DATA.picks.filter(x => x.r === r && x.w === o);
      let cls = (o === DATA.me && VIEW === "command" ? "mine" : "");
      if (clock && cell.some(x => x.o === clock.o)) cls += " now";
      if (!cell.length) { h += '<td class="' + cls + ' empty2"></td>'; return; }
      const inner = cell.map(pk => {
        const nm = ST.made[pk.o];
        if (!nm) return '<div class="slot0"><span class="pn">#' + pk.o + "</span></div>";
        const p = BY[nm] || { p: "RB" };
        return '<div class="slotf p' + (p.p || "RB") + '">'
          + '<span class="nm">' + esc(shortName(nm)) + "</span>"
          + '<span class="pn">#' + pk.o + "</span>"
          + '<br><span class="sub">' + (p.p || "") + " \u00b7 " + (p.t || "") + "</span></div>";
      }).join("");
      h += '<td class="' + cls + (cell.length > 1 ? " twin" : "") + '">' + inner + "</td>";
    });
    h += "</tr>";
  }
  h += "</table>";
  // phone fallback: the last dozen picks as a list
  const done = Object.keys(ST.made).map(Number).sort((a, b) => b - a).slice(0, 12);
  h += '<ul class="recent">' + (done.length ? done.map(o => {
    const nm = ST.made[o], p = BY[nm] || {};
    return "<li>" + posChip(p.p || "RB") + '<span class="nm">' + esc(nm) + "</span>"
      + '<span class="who">' + esc(DATA.picks.find(x => x.o === o).w) + " · #" + o + "</span></li>";
  }).join("") : '<li><span class="sub">No picks yet.</span></li>') + "</ul>";
  return h;
}

/* Odds as a ranked list. The stacked ribbon looked good and said less than
   ten numbers do, so it went. Delta is against the reading before this pick,
   which is meaningful now that the sim uses common random numbers. */
/** Probability to an American moneyline, rounded the way a book would print it.
    Everyone here is under 50%, so every line is plus-money. Rounding matters:
    +425 reads as odds, +426 reads as a spreadsheet. */
function moneyline(pct) {
  const n = Object.keys(ST.made).length;
  const p = Math.max(pct / 100, 1 / (2 * SEASONS));   // never divide by zero
  if (p >= 0.5) {
    const v = 100 * p / (1 - p);
    return "-" + Math.round(v / 5) * 5;
  }
  const v = 100 * (1 - p) / p;
  const r = v < 400 ? Math.round(v / 5) * 5
          : v < 1000 ? Math.round(v / 25) * 25
          : v < 5000 ? Math.round(v / 100) * 100
          : v < 25000 ? Math.round(v / 500) * 500
          : 25000;
  return "+" + r;
}

function oddsListHTML() {
  const pc = Object.keys(ST.made).length;
  let prev = null;
  for (let i = RIBBON.length - 1; i >= 0; i--) {
    if (RIBBON[i].pick < pc) { prev = RIBBON[i].odds; break; }
  }
  const rows = DATA.owners.slice().sort((x, y) => ODDS[y] - ODDS[x]);
  let h = '<table class="odds">';
  rows.forEach((o, i) => {
    const v = ODDS[o] || 0;
    const dv = prev ? v - (prev[o] || 0) : 0;
    const arrow = !prev || Math.abs(dv) < 0.35 ? '<span class="flat">—</span>'
      : dv > 0 ? '<span class="up">&#9650; ' + dv.toFixed(1) + "</span>"
               : '<span class="dn">&#9660; ' + Math.abs(dv).toFixed(1) + "</span>";
    // no highlight on the shared screen — same reason the board lost it
    h += "<tr" + (o === DATA.me && VIEW === "command" ? ' class="me"' : "") + ">"
      + '<td class="rk">' + (i + 1) + "</td>"
      + "<td>" + esc(o) + "</td>"
      + '<td class="ml">' + moneyline(v) + "</td>"
      + '<td class="pcs">' + v.toFixed(1) + "%</td>"
      + '<td class="dl">' + arrow + "</td></tr>";
  });
  return h + "</table>";
}

/* Types the line out character by character. The text has already arrived in
   full — this is presentation, not streaming — but the draft is slow and a
   line that appears all at once reads as a caption, while one that types reads
   as something being written right now.

   The hard part is that render() fires often (every odds recompute), so the
   animation has to survive re-renders without restarting. State lives outside
   the render cycle and the loop writes to the node directly. */
const TYPE_MS = 16;
let typeState = { key: "", full: "", shown: "", timer: null, done: true };

function stopTyping() { if (typeState.timer) clearInterval(typeState.timer); typeState.timer = null; }

function startTyping(key, full) {
  if (typeState.key === key && typeState.full === full) return;   // already on it
  stopTyping();
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  typeState = { key: key, full: full, shown: reduce ? full : "", timer: null, done: reduce };
  if (reduce) return;
  typeState.timer = setInterval(() => {
    const step = 1 + (typeState.shown.length > 90 ? 1 : 0);   // ease up once rolling
    typeState.shown = full.slice(0, typeState.shown.length + step);
    const el = document.getElementById("saytext");
    if (el) el.textContent = typeState.shown;
    const car = document.getElementById("caret");
    if (typeState.shown.length >= full.length) {
      stopTyping(); typeState.done = true;
      if (car) car.style.display = "none";
    }
  }, TYPE_MS);
}

/** A pick graded against where the market had him, once keepers are removed. */
function gradeOf(d) {
  if (d >= 25) return "A+";
  if (d >= 15) return "A";
  if (d >= 8) return "A-";
  if (d >= 3) return "B+";
  if (d >= -2) return "B";
  if (d >= -7) return "B-";
  if (d >= -14) return "C";
  if (d >= -24) return "D";
  return "F";
}

/** The last round where all ten picks are in. Zero until round one closes. */
function lastCompleteRound() {
  let best = 0;
  for (let r = 1; r <= 12; r++) {
    const picks = DATA.picks.filter(x => x.r === r);
    if (picks.length && picks.every(x => ST.made[x.o])) best = r;
  }
  return best;
}

/** Best and worst pick of a round, by how far each landed from the board. */
function roundExtremes(r) {
  const rows = DATA.picks.filter(x => x.r === r && ST.made[x.o]).map(x => {
    const nm = ST.made[x.o];
    return { o: x.o, w: x.w, n: nm, p: BY[nm], d: delta(nm, x.o) };
  }).filter(x => x.p);
  if (!rows.length) return null;
  const sorted = rows.slice().sort((a, b) => b.d - a.d);
  const counts = { QB:0, RB:0, WR:0, TE:0, K:0 };
  rows.forEach(x => counts[x.p.p]++);
  return { best: sorted[0], worst: sorted[sorted.length - 1], counts: counts, n: rows.length };
}

/** Written fallback if the API never answered for this round. */
function recapTemplate(r) {
  const e = roundExtremes(r); if (!e) return "";
  const led = POS.slice().sort((a, b) => e.counts[b] - e.counts[a])[0];
  const bits = POS.filter(q => e.counts[q]).map(q => e.counts[q] + " " + q);
  return "Round " + r + " went " + bits.join(", ") + ". "
    + (e.counts[led] >= 5 ? "A run on " + led + "s, and everyone saw it at once."
       : "No single position ran away with it.");
}

function recapFor(r) {
  if (ST.recap && ST.recap[r]) return { text: ST.recap[r], live: true };
  const t = recapTemplate(r);
  return t ? { text: t, live: false } : null;
}

function recapBlock(r, dim) {
  const e = roundExtremes(r); if (!e) return "";
  const rc = recapFor(r);
  const row = (label, x, cls) => '<div class="rcrow"><span class="rclab">'
    + label + '</span><span class="grade sm ' + cls + '">' + gradeOf(x.d) + "</span>"
    + '<span class="rcname">' + esc(x.n) + '</span>'
    + '<span class="rcwho">' + esc(x.w) + "</span></div>";
  let h = '<div class="rcblock' + (dim ? " prior" : "") + '">'
    + '<div class="rchead">Round ' + r + "</div>"
    + row("BEST", e.best, "gA") + row("WORST", e.worst, "gF");
  if (rc) h += '<div class="rcsay' + (rc.live ? " ai" : "") + '">' + esc(rc.text) + "</div>";
  return h + "</div>";
}

/** The last two completed rounds. The older one is dimmed so the eye lands on
    the newer without the panel turning into a wall. */
function recapHTML() {
  const r = lastCompleteRound();
  if (!r) return '<div class="sub">Recaps start once round one is complete.</div>';
  return recapBlock(r, false) + (r > 1 ? recapBlock(r - 1, true) : "");
}

function broadcastView() {
  const pk = onClock();
  const done = Object.keys(ST.made).map(Number).sort((a, b) => a - b);
  const last = done.length ? done[done.length - 1] : null;
  let h = "";

  h += '<div class="hero">';
  if (last !== null) {
    const nm = ST.made[last], p = BY[nm] || {}, d = delta(nm, last);

    h += '<div class="card fade" id="hero"><h2>Pick ' + last + " · "
      + esc(DATA.picks.find(x => x.o === last).w) + "</h2>"
      + '<div class="name">' + esc(nm) + "</div>"
      + '<div class="meta">' + posChip(p.p || "RB")
      + "<span>" + esc(p.t || "") + "</span>"
      + '<span class="grade ' + (d >= 3 ? "gA" : d >= -2 ? "gB" : d >= -14 ? "gC" : "gF")
      + '">' + gradeOf(d) + "</span></div></div>";
  } else {
    h += '<div class="card"><h2>Before the first pick</h2>'
      + '<div class="name">Keepers are in</div>'
      + '<div class="meta">Thirty players off the board. 120 picks to go.</div></div>';
  }
  h += '<div class="card"><h2>On the clock</h2>'
    + (pk ? '<div class="clockname">' + esc(DATA.teamName[pk.w] || pk.w) + "</div>"
        + '<div class="eyebrow" style="margin-top:8px">Round ' + pk.r
        + " · pick " + pk.o + " of 120</div>"
      : '<div class="clockname">Draft complete</div>');
  h += "</div></div>";

  h += '<div class="split">';
  h += '<div class="card"><h2>Championship odds'
    + (oddsBusy ? " · recomputing" : "") + "</h2>" + oddsListHTML()
    + '<div class="sub" style="margin-top:8px">' + SEASONS
    + " simulated seasons, recomputed every pick</div></div>";
  const lcr = lastCompleteRound();
  h += '<div class="card"><h2>Round recaps</h2>' + recapHTML() + "</div>";
  const cm = last === null ? null : commentary(last);
  const wr = last === null ? null : wireFor(last);
  const waiting = wr && !wr.live && ST.pending === last;
  h += '<div class="card"><h2 class="' + (wr && wr.live ? "hAI" : "hInstant") + '">'
    + (last === null ? "The wire" : wr && wr.live ? "AI insights" : "Instant analysis")
    + (waiting ? '<span class="incoming">AI insights incoming\u2026</span>' : "") + "</h2>"
    + (wr ? '<div class="say' + (wr.live ? " ai" : "") + '"><span id="saytext">'
        + esc(typeState.key === "w" + last && !typeState.done ? typeState.shown : wr.text)
        + '</span><span id="caret" class="caret"'
        + (typeState.key === "w" + last && !typeState.done ? "" : ' style="display:none"')
        + ">\u2588</span></div>"
      : '<div class="say">Keepers are set. Thirty players are already gone, '
        + "and the first pick of the draft is on the clock.</div>")
    + "</div>";
  h += "</div>";

  h += '<div class="card"><h2>Best available · consensus board</h2><div class="row">'
    + consensusAvail(16).map(p => '<span class="tag">' + posChip(p.p) + " "
      + esc(p.n) + "</span>").join("") + "</div></div>";
  h += '<div class="card"><h2>Board</h2>' + gridHTML() + "</div>";
  return h;
}

/* ------------------------------------------------------- command panels */

/** Best legal starting eight. The flex is the wrinkle: minimums are
    2/4/4/2/2 = 14 against a 15-man roster, so exactly ONE position carries a
    spare — a 5th RB, a 5th WR or a 3rd TE, never two. */
function lineupOf(names) {
  const by = { QB:[], RB:[], WR:[], TE:[], K:[] };
  names.forEach(n => { const p = BY[n]; if (p) by[p.p].push(p); });
  POS.forEach(q => by[q].sort((a, b) => b.pts - a.pts));
  const take = { QB:1, RB:2, WR:2, TE:1, K:1 };
  const start = [], used = {};
  POS.forEach(q => {
    used[q] = 0;
    for (let i = 0; i < take[q]; i++) if (by[q][i]) { start.push([q, by[q][i]]); used[q]++; }
  });
  let flex = null;
  ["RB","WR","TE"].forEach(q => {
    const c = by[q][used[q]];
    if (c && (!flex || c.pts > flex[1].pts)) flex = ["FLEX", c];
  });
  if (flex) start.push(flex);
  const inLineup = new Set(start.map(x => x[1].n));
  const bench = names.map(n => BY[n]).filter(p => p && !inLineup.has(p.n))
    .sort((a, b) => b.vor - a.vor);
  return { start: start, bench: bench, flex: flex };
}

function rosterFor(o) {
  const r = (DATA.keepers[o] || []).slice();
  DATA.picks.forEach(pk => { if (pk.w === o && ST.made[pk.o]) r.push(ST.made[pk.o]); });
  return r;
}
/** Best available that this owner can legally take. */
function bestLegalFor(o, round) {
  const r = rosterFor(o);
  for (const p of available().sort((a, b) => b.vor - a.vor)) {
    if (p.p === "K" && round && round < 8) continue;   // nobody does this
    if (roomFor(r, p.p)) return p;
  }
  return null;
}

function myRoster() {
  const mine = (DATA.keepers[DATA.me] || []).slice();
  DATA.picks.forEach(pk => {
    if (pk.w === DATA.me && ST.made[pk.o]) mine.push(ST.made[pk.o]);
  });
  return mine;
}

function needLine(names) {
  const c = { QB:0, RB:0, WR:0, TE:0, K:0 };
  names.forEach(n => { const p = BY[n]; if (p) c[p.p]++; });
  const short = POS.filter(q => c[q] < LIMIT[q][0])
    .map(q => (LIMIT[q][0] - c[q]) + " " + q);
  const slots = 15 - names.length;
  const spare = slots - short.reduce((a, s) => a + parseInt(s, 10), 0);
  return { short: short, slots: slots, spare: spare, counts: c };
}

  }
  return h;
}

    if (r.length > 15) bad.push(o + " has " + r.length + " players");

  if (bad.length) h += '<div class="warn">Check these — usually a mistyped name: '
    + bad.map(esc).join("; ") + "</div>";

/** Probability this player is still on the board at a given overall pick. */
function survivesTo(p, pickNo) {
  const t = taken();
  let ahead = 0;
  for (const q of DATA.players) {
    if (q.adp < p.adp && t.has(q.n)) ahead++;
  }
  const slot = Math.max(1, p.adp - ahead);
  return 1 / (1 + Math.exp((pickNo - slot) / 7));
}

/** Expected best projection at a position still available at `pickNo`, taken
    from sampled drafts rather than from consensus ADP. Cached per pick, since
    it runs ten completions and the answer only changes when a pick is made. */
let boardCache = { key: "", now: null, next: null };
/** My pick, and the one after it. Before the draft starts that is 9 then 19 —
    the horizon that matters is mine to mine, not whoever happens to be up. */
function myPickPair() {
  const mine = DATA.picks.filter(x => x.w === DATA.me && !ST.made[x.o]);
  return [mine[0] || null, mine[1] || null];
}
function boards() {
  const pair = myPickPair();
  const here = pair[0], nxt = pair[1];
  const key = (here ? here.o : 0) + ":" + (nxt ? nxt.o : 0) + ":"
    + Object.keys(ST.made).length;
  if (boardCache.key !== key) {
    boardCache = {
      key: key,
      now: here ? expectedBoard(here.o, 10) : null,
      next: nxt ? expectedBoard(nxt.o, 10) : null
    };
  }
  return boardCache;
}
function expectedBestAt(pos, which) {
  const b = boards();
  const t = which === "next" ? b.next : b.now;
  return t ? t[pos] : 0;
}

/** THE POINT OF THIS PANEL.
    VOR says what a player adds to a lineup. It does not say what it costs to
    wait. Jason Myers is worth 27 over a replacement kicker and he will still be
    sitting there in round 7, so spending pick 9 on him buys nothing. Urgency is
    the projection minus what the position is expected to offer at my NEXT pick
    — the actual price of deferring. */
function urgencyOf(p) {
  return p.pts - expectedBestAt(p.p, "next");
}

const URGENCY_FLOOR = 1.0;   // below this, the position can wait

function urgencyHTML() {
  const pair = myPickPair();
  const here = pair[0], nxt = pair[1];
  if (!here) return '<div class="sub">No picks left.</div>';
  if (!nxt) return '<div class="sub">Last pick — nothing left to defer to.</div>';
  const gap = nxt.o - here.o;
  const posUrg = {};
  POS.forEach(q => { posUrg[q] = expectedBestAt(q, "now") - expectedBestAt(q, "next"); });
  let h = '<div class="sub" style="margin-bottom:8px">My pick #' + here.o
    + " \u2192 #" + nxt.o + ", " + gap + " picks apart. "
    + "Urgency is what deferring a position across that gap costs.</div>";

  h += '<div class="row" style="margin-bottom:10px">' + POS.map(q =>
    '<span class="tag ' + (posUrg[q] >= URGENCY_FLOOR ? "tgt" : "") + '">' + q + " "
    + (posUrg[q] >= 0 ? "+" : "") + posUrg[q].toFixed(1) + "</span>").join("") + "</div>";

  const rows = available().map(p => {
    p._u = urgencyOf(p);
    p._s = survivesTo(p, nxt.o);
    return p;
  }).sort((a, b) => b.vor - a.vor).slice(0, 12);

  const parked = POS.filter(q => posUrg[q] < URGENCY_FLOOR);
  h += '<table class="odds"><tr><th></th><th></th><th>VOR</th><th>URG</th><th>SURV</th></tr>';
  rows.forEach(p => {
    const wait = posUrg[p.p] < URGENCY_FLOOR;
    h += "<tr" + (wait ? ' class="wait"' : "") + "><td>" + posChip(p.p)
      + "</td><td>" + esc(p.n) + "</td>"
      + '<td class="pcs">' + p.vor.toFixed(1) + "</td>"
      + '<td class="pcs" style="color:' + (p._u >= 2 ? "#3E8E6E" : p._u >= 0 ? "#A98A4B" : "#B05A44")
      + '">' + (p._u >= 0 ? "+" : "") + p._u.toFixed(1) + "</td>"
      + '<td class="pcs">' + (100 * p._s).toFixed(0) + "%</td></tr>";
  });
  h += "</table>";
  if (parked.length) h += '<div class="sub" style="margin-top:8px">Dimmed rows can wait: '
    + parked.map(q => q + " (" + posUrg[q].toFixed(1) + ")").join(", ") + "</div>";
  return h;
}

/** My next pick, and the chance each top player is still there for it.
    Logistic around his remaining market slot — the same shape the mock tool
    uses, recomputed against players actually gone rather than a simulation. */
function myNextPick() {
  for (const pk of DATA.picks)
    if (pk.w === DATA.me && !ST.made[pk.o]) return pk;
  return null;
}
function survivalHTML() {
  const nxt = myNextPick();
  if (!nxt) return '<div class="sub">No picks left.</div>';
  const here = onClock();
  const gap = nxt.o - (here ? here.o : nxt.o);
  const t = taken();
  const rows = available().sort((a, b) => b.vor - a.vor).slice(0, 12).map(p => {
    let ahead = 0;
    DATA.players.forEach(q => { if (q.adp < p.adp && t.has(q.n)) ahead++; });
    const slot = p.adp - ahead;
    const s = 1 / (1 + Math.exp((nxt.o - slot) / 7));
    return [p, s];
  });
  let h = '<div class="sub" style="margin-bottom:8px">Next pick: #' + nxt.o
    + " (round " + nxt.r + ") · " + gap + " picks away</div>";
  h += '<table class="odds">';
  rows.forEach(([p, s]) => {
    const pct = 100 * s;
    h += "<tr><td>" + posChip(p.p) + " " + esc(p.n) + "</td>"
      + '<td class="pc" style="color:' + (pct > 60 ? "#3E8E6E" : pct > 25 ? "#A98A4B" : "#B05A44")
      + '">' + pct.toFixed(0) + "%</td></tr>";
  });
  return h + "</table>";
}

/* The whole night in one document. Picks and commentary already persist in
   localStorage; this is the way to get them back out. Template lines are
   deterministic, so a pick the API never answered still reproduces exactly
   what was on screen. */
function buildTranscript() {
  const made = Object.keys(ST.made).map(Number).sort((a, b) => a - b);
  const L = [];
  L.push("SFFFL 2026 DRAFT");
  L.push(new Date().toLocaleString());
  L.push(made.length + " of 120 picks recorded");
  L.push("");
  let round = 0;
  made.forEach(o => {
    const pk = DATA.picks.find(x => x.o === o);
    if (pk && pk.r !== round) { round = pk.r; L.push(""); L.push("== ROUND " + round + " =="); }
    const nm = ST.made[o], p = BY[nm] || {};
    const d = delta(nm, o);
    L.push("#" + o + "  " + (pk ? pk.w : "?") + " — " + nm
      + " (" + (p.p || "?") + ", " + (p.t || "?") + ")"
      + "  slot " + (p.n ? marketSlot(p, o) : "?")
      + (d > 0 ? ", fell " + d : d < 0 ? ", reached " + (-d) : ", on the number")
      + (p.thin ? "  [deep tier]" : "") + (p.custom ? "  [typed in]" : ""));
    const wr = wireFor(o);
    if (wr) L.push("    " + wr.text + (wr.live ? "" : "   [written, not live]"));
  });
  L.push(""); L.push("== FINAL ROSTERS ==");
  DATA.owners.forEach(o => {
    const r = rosterFor(o), lu = lineupOf(r);
    L.push("");
    L.push(o + " — " + (DATA.teamName[o] || "") + "  (" + r.length + " players)");
    lu.start.forEach(([slot, p]) => L.push("    " + slot.padEnd(5) + " " + p.n
      + " (" + p.p + ", " + p.t + ")"));
    if (lu.bench.length) L.push("    BENCH " + lu.bench.map(p => p.n).join(", "));
  });
  L.push(""); L.push("== CHAMPIONSHIP ODDS AT THE FINAL PICK ==");
  DATA.owners.slice().sort((a, b) => ODDS[b] - ODDS[a]).forEach((o, i) =>
    L.push("  " + (i + 1) + ". " + o.padEnd(8) + (ODDS[o] || 0).toFixed(1) + "%"));
  return L.join("\n");
}

function downloadTranscript() {
  const txt = buildTranscript();
  const blob = new Blob([txt], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "SFFFL-2026-draft.txt";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function render() {
  document.getElementById("viewname").textContent =
    VIEW === "command" ? "Command" : "Broadcast";
  const app = document.getElementById("app");
  if (VIEW === "command" && !unlocked) {
    app.innerHTML = '<div class="gate card"><h2>Command board</h2>'
      + '<input type="text" id="pw" placeholder="passphrase">'
      + '<div class="row" style="margin-top:10px;justify-content:center">'
      + '<button class="primary" id="unlock">Unlock</button></div></div>';
    document.getElementById("unlock").onclick = () => {
      if (fnv(document.getElementById("pw").value) === PWHASH) {
        unlocked = true; render();
      }
    };
    return;
  }
  document.body.className = VIEW === "command" ? "" : "bcast";
  app.innerHTML = VIEW === "command" ? commandView() : broadcastView();
  if (VIEW === "command") wireCommand();
  if (VIEW === "broadcast") {
    const lastO = Object.keys(ST.made).map(Number).sort((a, b) => a - b).pop();
    if (lastO) { const wr = wireFor(lastO); if (wr) startTyping("w" + lastO, wr.text); }
  }
}

function wireCommand() {
  const inp = document.getElementById("q");
  if (inp) {
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
    inp.oninput = e => { q = e.target.value; cursor = 0; render(); };
    inp.onkeydown = e => {
      const m = matches();
      if (e.key === "ArrowDown") { cursor = Math.min(cursor + 1, m.length - 1); render(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { cursor = Math.max(cursor - 1, 0); render(); e.preventDefault(); }
      else if (e.key === "Enter" && m[cursor]) { commit(m[cursor].n); e.preventDefault(); }
      else if ((e.key === "t" || e.key === "T") && e.ctrlKey && m[cursor]) { toggleTag(m[cursor].n, "t"); e.preventDefault(); }
      else if ((e.key === "x" || e.key === "X") && e.ctrlKey && m[cursor]) { toggleTag(m[cursor].n, "x"); e.preventDefault(); }
    };
  }
  const go = document.getElementById("go");
  if (go) go.onclick = () => { const m = matches(); if (m[cursor]) commit(m[cursor].n); };
  const u = document.getElementById("undo");
  if (u) u.onclick = undo;
  const fb = document.getElementById("force");
  if (fb) fb.onclick = () => { const mm = matches(); if (mm[cursor]) commit(mm[cursor].n, true); };
  document.querySelectorAll("button.addpos").forEach(b => {
    b.onclick = () => {
      const nm = q.trim();
      const tm = (document.getElementById("addteam") || {}).value || "FA";
      if (addCustom(nm, b.dataset.p, tm)) commit(nm);
    };
  });
  const s10 = document.getElementById("sim10");
  if (s10) s10.onclick = () => {
    for (let i = 0; i < 10; i++) {
      const pk = onClock(); if (!pk) break;
      const p = bestLegalFor(pk.w, pk.r); if (!p) break;
      ST.made[pk.o] = p.n;
    }
    save(true); render(); computeOdds(render);
  };
  const sk = document.getElementById("savekey");
  if (sk) sk.onclick = () => {
    const v = document.getElementById("akey").value;
    if (v && v.indexOf("\u2022") < 0) setApiKey(v);
    render();
  };
  const tk = document.getElementById("testkey");
  if (tk) tk.onclick = testWire;
  const mu = document.getElementById("mute");
  if (mu) mu.onclick = () => { ST.mute = !ST.mute; save(true); render(); };
  const rg = document.getElementById("regen");
  if (rg) rg.onclick = () => {
    const o = Object.keys(ST.made).map(Number).sort((a, b) => a - b).pop();
    if (o) runWire(o, true);
  };
  const dl = document.getElementById("dltrans");
  if (dl) dl.onclick = downloadTranscript;
  const cp = document.getElementById("cptrans");
  if (cp) cp.onclick = async () => {
    const el = document.getElementById("transnote");
    try {
      await navigator.clipboard.writeText(buildTranscript());
      if (el) el.textContent = "copied to the clipboard";
    } catch (e) { if (el) el.textContent = "could not copy — use Download instead"; }
  };
  const rs = document.getElementById("reset");
  if (rs) rs.onclick = () => {
    if (!confirm("Clear every pick, all commentary and any typed-in players? "
      + "Download the transcript first if you want to keep it.")) return;
    ST = { made: {}, targets: ST.targets, note: {}, wire: {}, custom: {}, recap: {} };
    RIBBON = [];
    stopTyping(); typeState = { key: "", full: "", shown: "", timer: null, done: true };
    save(true); render(); computeOdds(render);
  };
  document.querySelectorAll("ul.sug li").forEach((li, i) => {
    li.onclick = () => { cursor = i; render(); };
    li.ondblclick = () => commit(li.dataset.n);
  });
}

/* FNV-1a, same gate as the mock tool */
function fnv(s) {
