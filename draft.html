}

function countsHTML() {
  let h = '<table class="counts"><tr><th></th>';
  POS.forEach(q => h += "<th>" + q + "</th>");
  h += "<th>tot</th></tr>";
  DATA.owners.forEach(o => {
    const c = { QB:0, RB:0, WR:0, TE:0, K:0 };
    (DATA.keepers[o] || []).forEach(n => { if (BY[n]) c[BY[n].p]++; });
    DATA.picks.forEach(pk => {
      if (pk.w === o && ST.made[pk.o] && BY[ST.made[pk.o]]) c[BY[ST.made[pk.o]].p]++;
    });
    let tot = 0; POS.forEach(q => tot += c[q]);
    h += "<tr" + (o === DATA.me ? ' class="me"' : "") + "><td>" + esc(o) + "</td>";
    POS.forEach(q => {
      const done = c[q] >= LIMIT[q][0];
      h += '<td class="' + (done ? "met" : "short") + '">' + c[q] + "</td>";
    });
    h += '<td class="pc">' + tot + "</td></tr>";
  });
  h += "</table>";
  const bad = [];
  DATA.owners.forEach(o => {
    const r = rosterFor(o), c = { QB:0, RB:0, WR:0, TE:0, K:0 };
    r.forEach(n => { if (BY[n]) c[BY[n].p]++; });
    POS.forEach(q => { if (c[q] > LIMIT[q][1]) bad.push(o + " has " + c[q] + " " + q); });
    if (r.length > 15) bad.push(o + " has " + r.length + " players");
  });
  if (bad.length) h += '<div class="warn">Check these — usually a mistyped name: '
    + bad.map(esc).join("; ") + "</div>";
  return h;
}

/** Probability this player is still on the board at a given overall pick. */
function survivesTo(p, pickNo) {
  const t = taken();
  let ahead = 0;
  for (const q of DATA.players) {
    if (q.adp < p.adp && t.has(q.n)) ahead++;
  }
  const slot = Math.max(1, p.adp - ahead);
  return 1 / (1 + Math.exp((pickNo - slot) / 7));
}

/** Expected best projection at a position still available at `pickNo`, taken
    from sampled drafts rather than from consensus ADP. Cached per pick, since
    it runs ten completions and the answer only changes when a pick is made. */
let boardCache = { key: "", now: null, next: null };
/** My pick, and the one after it. Before the draft starts that is 9 then 19 —
    the horizon that matters is mine to mine, not whoever happens to be up. */
function myPickPair() {
  const mine = DATA.picks.filter(x => x.w === DATA.me && !ST.made[x.o]);
  return [mine[0] || null, mine[1] || null];
}
function boards() {
  const pair = myPickPair();
  const here = pair[0], nxt = pair[1];
  const key = (here ? here.o : 0) + ":" + (nxt ? nxt.o : 0) + ":"
    + Object.keys(ST.made).length;
  if (boardCache.key !== key) {
    boardCache = {
      key: key,
      now: here ? expectedBoard(here.o, 10) : null,
      next: nxt ? expectedBoard(nxt.o, 10) : null
    };
  }
  return boardCache;
}
function expectedBestAt(pos, which) {
  const b = boards();
  const t = which === "next" ? b.next : b.now;
  return t ? t[pos] : 0;
}

/** THE POINT OF THIS PANEL.
    VOR says what a player adds to a lineup. It does not say what it costs to
    wait. Jason Myers is worth 27 over a replacement kicker and he will still be
    sitting there in round 7, so spending pick 9 on him buys nothing. Urgency is
    the projection minus what the position is expected to offer at my NEXT pick
    — the actual price of deferring. */
function urgencyOf(p) {
  return p.pts - expectedBestAt(p.p, "next");
}

const URGENCY_FLOOR = 1.0;   // below this, the position can wait

/* How far above the market I have to be before a pick is a leap of faith.
   `leap` is built in gen.py: my rank by value over replacement, against the
   market's rank on the Boone-blended prior. A big positive number means nothing
   but my own projection is holding the pick up. Boone and the six-source
   consensus agree with each other 96% of the time, so when a player shows up
   here it is my model against everybody. */
const LEAP_FLAG = 30;

function leapCell(p) {
  if (p.leap == null) return '<span style="color:#8195A8">\u2014</span>';
  const c = p.leap >= LEAP_FLAG ? "#B05A44" : p.leap <= -LEAP_FLAG ? "#3E8E6E" : "#8195A8";
  return '<span style="color:' + c + '">' + (p.leap > 0 ? "+" : "") + p.leap
    + "</span>";
}

function urgencyHTML() {
  const pair = myPickPair();
  const here = pair[0], nxt = pair[1];
  if (!here) return '<div class="sub">No picks left.</div>';
  if (!nxt) return '<div class="sub">Last pick — nothing left to defer to.</div>';
  const gap = nxt.o - here.o;
  const posUrg = {};
  POS.forEach(q => { posUrg[q] = expectedBestAt(q, "now") - expectedBestAt(q, "next"); });
  let h = '<div class="sub" style="margin-bottom:8px">My pick #' + here.o
    + " \u2192 #" + nxt.o + ", " + gap + " picks apart. "
    + "Urgency is what deferring a position across that gap costs.</div>";

  h += '<div class="row" style="margin-bottom:10px">' + POS.map(q =>
    '<span class="tag ' + (posUrg[q] >= URGENCY_FLOOR ? "tgt" : "") + '">' + q + " "
    + (posUrg[q] >= 0 ? "+" : "") + posUrg[q].toFixed(1) + "</span>").join("") + "</div>";

  const rows = available().map(p => {
    p._u = urgencyOf(p);
    p._s = survivesTo(p, nxt.o);
    return p;
  }).sort((a, b) => b.vor - a.vor).slice(0, 12);

  const parked = POS.filter(q => posUrg[q] < URGENCY_FLOOR);
  h += '<table class="odds"><tr><th></th><th></th><th>VOR</th><th>URG</th><th>SURV</th>'
    + "<th>MKT</th></tr>";
  rows.forEach(p => {
    const wait = posUrg[p.p] < URGENCY_FLOOR;
    h += "<tr" + (wait ? ' class="wait"' : "") + "><td>" + posChip(p.p)
      + "</td><td>" + esc(p.n) + "</td>"
      + '<td class="pcs">' + p.vor.toFixed(1) + "</td>"
      + '<td class="pcs" style="color:' + (p._u >= 2 ? "#3E8E6E" : p._u >= 0 ? "#A98A4B" : "#B05A44")
      + '">' + (p._u >= 0 ? "+" : "") + p._u.toFixed(1) + "</td>"
      + '<td class="pcs">' + (100 * p._s).toFixed(0) + "%</td>"
      + '<td class="pcs">' + leapCell(p) + "</td></tr>";
  });
  h += "</table>";
  const leaps = rows.filter(p => (p.leap || 0) >= LEAP_FLAG);
  if (leaps.length) h += '<div class="sub" style="margin-top:8px">'
    + '<b style="color:#B05A44">Leap of faith:</b> '
    + leaps.map(p => esc(p.n) + " (+" + p.leap + ")").join(", ")
    + ". My number is carrying these on its own \u2014 the market and Boone both "
    + "have them later. If the projection is wrong there is nothing else holding "
    + "the pick up.</div>";
  if (parked.length) h += '<div class="sub" style="margin-top:8px">Dimmed rows can wait: '
    + parked.map(q => q + " (" + posUrg[q].toFixed(1) + ")").join(", ") + "</div>";
  return h;
}

/** My next pick, and the chance each top player is still there for it.
    Logistic around his remaining market slot — the same shape the mock tool
    uses, recomputed against players actually gone rather than a simulation. */
function myNextPick() {
  for (const pk of DATA.picks)
    if (pk.w === DATA.me && !ST.made[pk.o]) return pk;
  return null;
}
function survivalHTML() {
  const nxt = myNextPick();
  if (!nxt) return '<div class="sub">No picks left.</div>';
  const here = onClock();
  const gap = nxt.o - (here ? here.o : nxt.o);
  const t = taken();
  const rows = available().sort((a, b) => b.vor - a.vor).slice(0, 12).map(p => {
    let ahead = 0;
    DATA.players.forEach(q => { if (q.adp < p.adp && t.has(q.n)) ahead++; });
    const slot = p.adp - ahead;
    const s = 1 / (1 + Math.exp((nxt.o - slot) / 7));
    return [p, s];
  });
  let h = '<div class="sub" style="margin-bottom:8px">Next pick: #' + nxt.o
    + " (round " + nxt.r + ") · " + gap + " picks away</div>";
  h += '<table class="odds">';
  rows.forEach(([p, s]) => {
    const pct = 100 * s;
    h += "<tr><td>" + posChip(p.p) + " " + esc(p.n) + "</td>"
      + '<td class="pc" style="color:' + (pct > 60 ? "#3E8E6E" : pct > 25 ? "#A98A4B" : "#B05A44")
      + '">' + pct.toFixed(0) + "%</td></tr>";
  });
  return h + "</table>";
}

/* The whole night in one document. Picks and commentary already persist in
   localStorage; this is the way to get them back out. Template lines are
   deterministic, so a pick the API never answered still reproduces exactly
   what was on screen. */
function buildTranscript() {
  const made = Object.keys(ST.made).map(Number).sort((a, b) => a - b);
  const L = [];
  L.push("SFFFL 2026 DRAFT");
  L.push(new Date().toLocaleString());
  L.push(made.length + " of 120 picks recorded");
  L.push("");
  let round = 0;
  made.forEach(o => {
    const pk = DATA.picks.find(x => x.o === o);
    if (pk && pk.r !== round) { round = pk.r; L.push(""); L.push("== ROUND " + round + " =="); }
    const nm = ST.made[o], p = BY[nm] || {};
    const d = delta(nm, o);
    L.push("#" + o + "  " + (pk ? pk.w : "?") + " — " + nm
      + " (" + (p.p || "?") + ", " + (p.t || "?") + ")"
      + "  slot " + (p.n ? marketSlot(p, o) : "?")
      + (d > 0 ? ", fell " + d : d < 0 ? ", reached " + (-d) : ", on the number")
      + (p.thin ? "  [deep tier]" : "") + (p.custom ? "  [typed in]" : ""));
    const wr = wireFor(o);
    if (wr) L.push("    " + wr.text + (wr.live ? "" : "   [written, not live]"));
  });
  L.push(""); L.push("== FINAL ROSTERS ==");
  DATA.owners.forEach(o => {
    const r = rosterFor(o), lu = lineupOf(r);
    L.push("");
    L.push(o + " — " + (DATA.teamName[o] || "") + "  (" + r.length + " players)");
    lu.start.forEach(([slot, p]) => L.push("    " + slot.padEnd(5) + " " + p.n
      + " (" + p.p + ", " + p.t + ")"));
    if (lu.bench.length) L.push("    BENCH " + lu.bench.map(p => p.n).join(", "));
  });
  L.push(""); L.push("== CHAMPIONSHIP ODDS AT THE FINAL PICK ==");
  DATA.owners.slice().sort((a, b) => ODDS[b] - ODDS[a]).forEach((o, i) =>
    L.push("  " + (i + 1) + ". " + o.padEnd(8) + (ODDS[o] || 0).toFixed(1) + "%"));
  return L.join("\n");
}

function downloadTranscript() {
  const txt = buildTranscript();
  const blob = new Blob([txt], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "SFFFL-2026-draft.txt";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* The sanity check, on the man about to be entered.

   Boone is a ranking for a yardage league and agrees with the six-source
   consensus 96% of the time, so a whole second board would have been the same
   board twice. What is worth seeing is the disagreement, at the one moment it
   can still change the pick: where he has this player, where the room has him,
   where mine does, and how far off the pace the pick would be. It says what the
   numbers are and leaves the decision alone. */
function sanityHTML(p) {
  const pk = onClock();
  if (!p || !pk) return "";
  const pool = DATA.players.filter(q => !q.thin && !KEPT.has(q.n) && q.p !== "K");
  const mine = pool.slice().sort((a, b) => b.vor - a.vor)
    .findIndex(q => q.n === p.n) + 1;
  const bits = [];
  // all three on this draft's scale, so the three numbers are comparable
  bits.push("my board <b>#" + (mine || "\u2014") + "</b>");
  bits.push("consensus <b>#" + (SLOT[p.n] || "\u2014") + "</b>");
  bits.push("Boone <b>" + (BSLOT[p.n] ? "#" + BSLOT[p.n] : "unranked") + "</b>");

  let verdict = "";
  if (p.p === "K") {
    verdict = "Kickers sit outside Boone's real list and the consensus ranks "
      + "them for a different game. No sanity check available here \u2014 judge it "
      + "on the round.";
  } else if (BSLOT[p.n]) {
    const off = BSLOT[p.n] - pk.o;
    if (off >= 40)
      verdict = "Boone has him <b>" + off + " picks later</b> than this. "
        + (p.leap != null && p.leap >= LEAP_FLAG
            ? "My projection is the only thing holding this pick up."
            : "Worth a beat before you commit.");
    else if (off <= -25)
      verdict = "Boone has him <b>" + Math.abs(off)
        + " picks earlier</b> than this \u2014 he thinks this is late value.";
    else verdict = "Boone is within a round of this pick. No argument here.";
  } else {
    verdict = "Not in Boone's top 300 at all.";
  }
  const hot = BSLOT[p.n] && BSLOT[p.n] - pk.o >= 40;
  return '<div class="sanity' + (hot ? " hot" : "") + '">'
    + '<span class="snm">' + esc(p.n) + "</span> \u00b7 " + bits.join(" \u00b7 ")
    + '<div class="sv">' + verdict + "</div></div>";
}

/** What is on the line at MY pick, and nowhere else: targets still alive, and
    what waiting for the next pick costs. Deliberately three lines -- the full
    urgency board is a card lower down, and this is meant to be read in the four
    seconds before typing a name. */
function onClockHTML() {
  const here = onClock();
  // myNextPick() returns the pick I am ON when it is my turn, which is not the
  // one I am deciding against. The question here is what waiting until the pick
  // AFTER this one costs.
  const nxt = here
    ? DATA.picks.find(x => x.w === DATA.me && x.o > here.o && !ST.made[x.o])
    : null;
  const alive = Object.keys(ST.targets)
    .filter(n => ST.targets[n] === "t" && !taken().has(n));
  const bits = [];
  if (alive.length)
    bits.push('<b>Targets still there:</b> ' + alive.slice(0, 5).map(esc).join(", "));
  else if (Object.keys(ST.targets).length)
    bits.push('<span class="sub">No targets left on the board.</span>');
  if (nxt && here) {
    const gap = nxt.o - here.o;
    const worst = POS.map(qq => [qq, expectedBestAt(qq, "now") - expectedBestAt(qq, "next")])
      .filter(x => x[1] >= URGENCY_FLOOR)
      .sort((a, b) => b[1] - a[1]);
    bits.push("<b>" + gap + " picks</b> until #" + nxt.o
      + (worst.length
          ? ". Costliest to defer: " + worst.slice(0, 2)
              .map(x => x[0] + " (\u2212" + x[1].toFixed(1) + ")").join(", ")
          : ". Nothing is urgent."));
  }
  return bits.length ? '<div class="clockstrip">' + bits.join("<br>") + "</div>" : "";
}

/** Command-side trade desk. Craig says what happened, this turns it into pick
    reassignments. The Commit button stays dead until the counts balance, because
    an unbalanced trade is not a thing the league allows and finding that out at
    pick 60 is worse than finding it out now. */
function tradeCardHTML() {
  const moves = parseTrade(tradeDraft);
  const trouble = tradeDraft.trim() ? tradeTrouble(moves) : null;
  const okNow = tradeDraft.trim() && !trouble;
  const imb = tradeImbalance();
  let h = '<div class="card"><h2>Trades<span class="mode quiet">picks only</span></h2>';
  if (tradeMsg) h += '<div class="trbad">' + esc(tradeMsg) + "</div>";
  if (imb.length)
    h += '<div class="blocked"><b>The board is unbalanced.</b> ' + esc(imb.join(", "))
      + '. Someone will finish the night with the wrong number of players.</div>';
  h += '<div class="sub">One line per pick, as <b>round.pick &gt; new owner</b>, '
    + 'comma separated. Overall numbers work too. Next year\u2019s picks go in the '
    + 'note \u2014 the tool cannot see them, but everyone still has to finish with '
    + 'the picks he started with.</div>';
  h += '<input type="text" id="trin" placeholder="2.09 &gt; Craig, 12.04 &gt; Ben" '
    + 'autocomplete="off" value="' + esc(tradeDraft) + '">';
  h += '<input type="text" id="trnote" placeholder="note (opt) \u2014 e.g. Craig sends his 2027 1st and 3rd" '
    + 'autocomplete="off" value="' + esc(tradeNote) + '">';
  /* The double check. Typing 6.09 when Craig said 6.10 is a quiet, plausible
     mistake that would hand away the wrong pick and not look wrong afterwards.
     So every line is read back with the overall number and the man who holds it
     right now, and nothing moves until that has been confirmed. */
  if (tradeDraft.trim()) {
    if (trouble) h += '<div class="trbad">' + esc(trouble) + "</div>";
    else h += '<div class="trok">' + moves.map(mv => {
      const from = (DATA.picks.find(x => x.o === mv.o) || {}).w;
      return '<div class="trline">' + esc(pickBoth(mv.o)) + " \u2014 "
        + esc(from === DATA.me ? "mine" : from + "'s") + " now, goes to <b>"
        + esc(mv.to) + "</b></div>";
    }).join("") + '<div class="trline dimtxt">Counts balance.</div></div>';
  }
  if (tradeArmed && okNow) {
    h += '<div class="trconf"><b>Confirm this trade.</b> ' + esc(tradeLine({ moves: moves }))
      + (tradeNote.trim() ? " \u2014 " + esc(tradeNote.trim()) : "")
      + '<div class="row" style="margin-top:8px">'
      + '<button class="primary" id="tryes">Yes, make the trade</button>'
      + '<button id="trno">Go back</button></div></div>';
  } else {
    h += '<div class="row" style="margin-top:9px">'
      + '<button class="primary" id="trgo"' + (okNow ? "" : " disabled") + ">Review trade</button>"
      + '<button id="trclear">Clear</button></div>';
  }
  const log = (ST.trades || []).slice().reverse();
  h += '<div class="trlog">' + (log.length
    ? log.map(t => '<div class="trrow"><span class="trwhat">' + esc(tradeLine(t))
        + "</span>" + (t.note ? '<span class="trnote">' + esc(t.note) + "</span>" : "")
        + '<button class="trundo" data-id="' + t.id + '">undo</button></div>').join("")
    : '<div class="sub">No trades yet.</div>') + "</div>";
  return h + "</div>";
}

function tradeCardHTMLBcast() {
  const log = (ST.trades || []).slice().reverse();
  if (!log.length) return "";
  return '<div class="card"><h2>Trades</h2>'
    + log.map(t => '<div class="btrade">' + esc(tradeLine(t))
        + (t.note ? ' <span class="dimtxt">' + esc(t.note) + "</span>" : "")
        + "</div>").join("")
    + "</div>";
}

function commandView() {
  const pk = onClock();
  const m = matches();
  /* Two modes, and the difference is the whole point of this card.

     On somebody else's pick there is no decision to make: a name gets called and
     the job is to type it correctly and fast. Anything else on screen is in the
     way -- and worse, a judgement panel next to a pick that has already happened
     invites second-guessing a thing nobody can change.

     On my pick the card becomes a decision surface: the sanity check against
     Boone and the market, my targets still on the board, and what the wait to my
     next pick costs. */
  const mine = !!pk && pk.w === DATA.me;
  let h = '<div class="card' + (mine ? " onclock" : "") + '">';
  if (!pk) h += "<h2>Draft complete</h2>";
  else if (mine) h += '<h2>Your pick \u00b7 #' + pk.o + " \u00b7 round " + pk.r
    + '<span class="mode">on the clock</span></h2>';
  else h += "<h2>Pick " + pk.o + " \u00b7 " + esc(pk.w) + " \u00b7 round " + pk.r
    + '<span class="mode quiet">recording</span></h2>';
  h += '<input type="text" id="q" placeholder="Type a player…" '
    + 'autocomplete="off" value="' + esc(q) + '">';
  h += '<ul class="sug">' + m.map((p, i) =>
    '<li class="' + (i === cursor ? "on" : "") + '" data-n="' + esc(p.n) + '">'
    + posChip(p.p) + '<span class="nm">' + esc(p.n) + "</span>"
    + '<span class="sub">' + (p.t || "") + " · ADP " + p.adp + "</span>"
    + (ST.targets[p.n] === "t" ? '<span class="tag tgt">TARGET</span>' : "")
    + (ST.targets[p.n] === "x" ? '<span class="tag dnd">DO NOT</span>' : "")
    + "</li>").join("") + "</ul>";
  if (mine && m[cursor]) h += sanityHTML(m[cursor]);
  if (mine) h += onClockHTML();
  if (blockMsg) {
    h += '<div class="blocked"><b>Illegal pick.</b> ' + esc(blockMsg)
      + ' <button id="force">Enter it anyway</button></div>';
  }
  if (q.trim() && !m.length) {
    h += '<div class="addbox"><div class="sub">No match for <b>'
      + esc(q.trim()) + '</b>. Pick a position to add him and take the pick:</div>'
      + '<div class="row" style="margin-top:8px">'
      + POS.map(p => '<button class="addpos" data-p="' + p + '">' + p + '</button>').join("")
      + '<input type="text" id="addteam" placeholder="team (opt)" style="width:110px">'
      + '</div></div>';
  }
  h += '<div class="row" style="margin-top:10px">'
    + '<button class="primary" id="go">Enter pick</button>'
    + '<button id="undo">Undo last</button>'
    + '<button id="sim10">Auto-pick 10</button>'
    + '<button id="reset">Clear draft</button></div>'
    + '<div class="sub" style="margin-top:8px">Auto-pick fills with best available '
    + 'so you can watch the ribbon move without typing. Clear wipes everything.</div>'
    + "</div>";

  h += tradeCardHTML();

  h += '<div class="card"><h2>My targets</h2><div class="row">';
  const tg = Object.keys(ST.targets);
  h += tg.length ? tg.map(n => '<span class="tag '
    + (ST.targets[n] === "t" ? "tgt" : "dnd") + '" data-tag="' + esc(n) + '">'
    + esc(n) + (taken().has(n) ? " ✕" : "") + "</span>").join("")
    : '<span class="sub">none yet — press T or X on a search result</span>';
  h += "</div></div>";

  const lastO = Object.keys(ST.made).map(Number).sort((a, b) => a - b).pop();
  h += '<div class="card"><h2>The wire</h2>'
    + '<div class="row"><input type="password" id="akey" placeholder="Anthropic API key" '
    + 'value="' + (apiKey() ? "\u2022".repeat(18) : "") + '" style="flex:1;min-width:200px">'
    + '<button id="savekey">Save</button><button id="testkey">Test</button></div>'
    + '<div class="sub" id="wiretest" style="margin-top:8px">'
    + (apiKey() ? "key saved on this device" : "no key — written commentary will be used")
    + (wireErr ? " · last error: " + esc(wireErr) : "") + "</div>"
    + '<div class="row" style="margin-top:10px">'
    + '<button id="mute">' + (ST.mute ? "Wire muted — turn on" : "Mute the wire") + "</button>"
    + (lastO ? '<button id="regen">' + (wireBusy ? "writing…" : "Regenerate last") + "</button>" : "")
    + "</div>"
    + (lastO && ST.wire && ST.wire[lastO] ? '<div class="note" style="margin-top:10px">'
        + esc(ST.wire[lastO]) + "</div>" : "")
    + '<div class="row" style="margin-top:12px">'
    + '<button id="dltrans">Download transcript</button>'
    + '<button id="cptrans">Copy transcript</button></div>'
    + '<div class="sub" id="transnote" style="margin-top:6px">'
    + "build " + BUILD + " · rev " + (ST.rev || 0) + " · "
    + (stale.length ? stale.length + " stale message(s) ignored · " : "")
    + Object.keys(ST.made).length + " picks recorded, "
    + Object.keys(ST.wire || {}).length + " live lines saved. Cleared when you clear the draft."
    + "</div>"
    + "</div>";
  h += '<div class="split3">';
  h += '<div class="card"><h2>My roster</h2>' + rosterHTML() + "</div>";
  h += '<div class="card"><h2>The board at my pick</h2>' + urgencyHTML() + "</div>";
  h += '<div class="card"><h2>Positions drafted</h2>' + countsHTML() + "</div>";
  h += "</div>";
  h += '<div class="card"><h2>The big board</h2>' + bigBoardHTML() + "</div>";
  h += '<div class="card"><h2>Board</h2>' + gridHTML() + "</div>";
  return h;
}

function render() {
  applyTrades();
  document.getElementById("viewname").textContent =
    VIEW === "command" ? "Command" : "Broadcast";
  const rf = document.getElementById("roomflip");
  if (rf) {
    rf.style.display = VIEW === "command" && unlocked ? "" : "none";
    rf.textContent = ST.face === "pick" ? "Room \u2192 board" : "Room \u2192 pick";
  }
  const app = document.getElementById("app");
  if (VIEW === "command" && !unlocked) {
    app.innerHTML = '<div class="gate card"><h2>Command board</h2>'
      + '<input type="text" id="pw" placeholder="passphrase">'
      + '<div class="row" style="margin-top:10px;justify-content:center">'
      + '<button class="primary" id="unlock">Unlock</button></div></div>';
    document.getElementById("unlock").onclick = () => {
      const pass = document.getElementById("pw").value;
      if (fnv(pass) === PWHASH) {
        unlocked = true;
        seedTargets(pass);          // only bites on a machine with no state yet
        render();
      }
    };
    return;
  }
  document.body.className = VIEW === "command" ? "" : "bcast";
  app.innerHTML = VIEW === "command" ? commandView() : broadcastView();
  if (VIEW === "command") wireCommand();
  if (VIEW === "broadcast") {
    const lastO = Object.keys(ST.made).map(Number).sort((a, b) => a - b).pop();
    if (lastO) { const wr = wireFor(lastO); if (wr) startTyping("w" + lastO, wr.text); }
  }
}

function wireCommand() {
  const inp = document.getElementById("q");
  if (inp) {
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
    inp.oninput = e => { q = e.target.value; cursor = 0; render(); };
    inp.onkeydown = e => {
      const m = matches();
      if (e.key === "ArrowDown") { cursor = Math.min(cursor + 1, m.length - 1); render(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { cursor = Math.max(cursor - 1, 0); render(); e.preventDefault(); }
      else if (e.key === "Enter" && m[cursor]) { commit(m[cursor].n); e.preventDefault(); }
      else if ((e.key === "t" || e.key === "T") && e.ctrlKey && m[cursor]) { toggleTag(m[cursor].n, "t"); e.preventDefault(); }
      else if ((e.key === "x" || e.key === "X") && e.ctrlKey && m[cursor]) { toggleTag(m[cursor].n, "x"); e.preventDefault(); }
    };
  }
  const go = document.getElementById("go");
  if (go) go.onclick = () => { const m = matches(); if (m[cursor]) commit(m[cursor].n); };
  const u = document.getElementById("undo");
  if (u) u.onclick = undo;
  const tt = document.getElementById("tgltaken");
  if (tt) tt.onclick = () => { ST.showTaken = !ST.showTaken; save(true); render(); };
  const sv1 = document.getElementById("srtvor");
  if (sv1) sv1.onclick = () => { ST.boardSort = "vor"; save(true); render(); };
  const sv2 = document.getElementById("srtval");
  if (sv2) sv2.onclick = () => { ST.boardSort = "val"; save(true); render(); };

  /* Re-render on input so the balance readout tracks what is being typed. The
     caret is restored because this card is being filled in while Craig talks. */
  const tin = document.getElementById("trin");
  if (tin) {
    tin.oninput = e => {
      const at = e.target.selectionStart;
      tradeDraft = e.target.value; tradeArmed = false; tradeMsg = ""; render();
      const back = document.getElementById("trin");
      if (back) { back.focus(); back.setSelectionRange(at, at); }
    };
    tin.onkeydown = e => {
      if (e.key === "Enter") {
        const g = document.getElementById("trgo");
        if (g && !g.disabled) { g.onclick(); e.preventDefault(); }
      }
    };
  }
  const tnote = document.getElementById("trnote");
  if (tnote) tnote.oninput = e => { tradeNote = e.target.value; tradeArmed = false; };
  const tgo = document.getElementById("trgo");
  if (tgo) tgo.onclick = () => { tradeArmed = true; render(); };
  const tyes = document.getElementById("tryes");
  if (tyes) tyes.onclick = () => {
    const bad = commitTrade(parseTrade(tradeDraft), tradeNote);
    tradeArmed = false;
    if (!bad) { tradeDraft = ""; tradeNote = ""; }
    render();
  };
  const tno = document.getElementById("trno");
  if (tno) tno.onclick = () => { tradeArmed = false; render(); };
  const tcl = document.getElementById("trclear");
  if (tcl) tcl.onclick = () => { tradeDraft = ""; tradeNote = ""; tradeArmed = false; render(); };
  document.querySelectorAll(".trundo").forEach(b => {
    b.onclick = () => { tradeMsg = undoTrade(Number(b.dataset.id)) || ""; render(); };
  });
  const fb = document.getElementById("force");
  if (fb) fb.onclick = () => { const mm = matches(); if (mm[cursor]) commit(mm[cursor].n, true); };
  document.querySelectorAll("button.addpos").forEach(b => {
    b.onclick = () => {
      const nm = q.trim();
      const tm = (document.getElementById("addteam") || {}).value || "FA";
      if (addCustom(nm, b.dataset.p, tm)) commit(nm);
    };
  });
  const s10 = document.getElementById("sim10");
  if (s10) s10.onclick = () => {
    for (let i = 0; i < 10; i++) {
      const pk = onClock(); if (!pk) break;
      const p = bestLegalFor(pk.w, pk.r); if (!p) break;
      ST.made[pk.o] = p.n;
    }
    save(true); render(); computeOdds(render);
  };
  const sk = document.getElementById("savekey");
  if (sk) sk.onclick = () => {
    const v = document.getElementById("akey").value;
    if (v && v.indexOf("\u2022") < 0) setApiKey(v);
    render();
  };
  const tk = document.getElementById("testkey");
  if (tk) tk.onclick = testWire;
  const mu = document.getElementById("mute");
  if (mu) mu.onclick = () => { ST.mute = !ST.mute; save(true); render(); };
  const rg = document.getElementById("regen");
  if (rg) rg.onclick = () => {
    const o = Object.keys(ST.made).map(Number).sort((a, b) => a - b).pop();
    if (o) runWire(o, true);
  };
  const dl = document.getElementById("dltrans");
  if (dl) dl.onclick = downloadTranscript;
  const cp = document.getElementById("cptrans");
  if (cp) cp.onclick = async () => {
    const el = document.getElementById("transnote");
    try {
      await navigator.clipboard.writeText(buildTranscript());
      if (el) el.textContent = "copied to the clipboard";
    } catch (e) { if (el) el.textContent = "could not copy — use Download instead"; }
  };
  const rs = document.getElementById("reset");
  if (rs) rs.onclick = () => {
    if (!confirm("Clear every pick, all commentary and any typed-in players? "
      + "Download the transcript first if you want to keep it.")) return;
    // trades survive a clear: they are things that actually happened in the room,
    // not draft progress being re-run
    ST = { made: {}, targets: ST.targets, trades: ST.trades, note: {}, wire: {}, custom: {}, recap: {}, face: "board" };
    RIBBON = [];
    stopTyping(); typeState = { key: "", full: "", shown: "", timer: null, done: true };
    save(true); render(); computeOdds(render);
  };
  document.querySelectorAll("ul.sug li").forEach((li, i) => {
    li.onclick = () => { cursor = i; render(); };
    li.ondblclick = () => commit(li.dataset.n);
  });
}

/* FNV-1a, same gate as the mock tool */
function fnv(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
  }
  return h.toString(16).padStart(8, "0");
}

/* The target list ships sealed, because this file lives in a public repo and a
   list headed "Ben's ten targets" would be the most useful thing in the league
   for anyone who thought to look. Same keystream as the mock tool's vault,
   keyed on the passphrase that opens Command — so it decodes at the gate and
   nowhere else. Not real cryptography; it does not need to be. It needs to
   survive somebody opening view-source out of curiosity. */
const TARGETSEED = "4Dl6FX3AfLJ3X9eJKhS20T/noE5NXVDkeT8pX4kc6M+Ub8WBv3IUNBzzHBcWtZwphew+zekCb9LadpizXUxrsm7MChTMCL/d/7HpPDu7lr9EEVIDXrVc6+9FEkByhV4E4Z27QyqVw3xX8tw+Dkllkuy96hbYKv2S11y7wnUOFPmtoxqZszPBm7bLvIMnzXcAMwn8oO5APN4Tb65+1DbsZDEns4Awx3xEYW1WgpKXjb1C0Z4InCGcBkGdsW8Exjt4rB6kGDXfrAZvfUfS3kHyV2gxcAd2v7czu7rEYxrjy3BlCAYLF/JH56dpA8+EPV9nYzDGZ4N6yY7vjRWBXHUCJHMoike1nSX+5BrtyeOf0P3JK384h8D6VhrsaAURm3w3ZNDXOmMvrhHFdR0eGkr0oOsjLrj2wiaVPwuLa0mZ/J0hff3olddlr4j2u7nsNJT47pYKIJIaSDQyUEL+Sh651bKuNdQpT1mKPjGILzXWao2WVa0lsPb8AbIFBRFMLy3ztORxGnD/YhHh3Q/Fyc05rs+q6sR41EZhXaeVQ14+zwmxEn6ukoahs3HeFUAsZi1THJL/HwrKLSJHdn0qM2/Hz2+5Jsj08hIm2aZCj73929pTzNsDfC875HV7MaEz7Pqk3sR9MUg6Ik9Z8BZCHHJ8";
function keystream(pass) {
  let h = 0x811c9dc5;
  for (let i = 0; i < pass.length; i++) { h ^= pass.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  h >>>= 0;
  return () => {
    h ^= h << 13; h >>>= 0;
    h ^= h >>> 17;
    h ^= h << 5; h >>>= 0;
    return h & 255;
  };
}
function unseal(blob, pass) {
  try {
    const bin = atob(blob), k = keystream(pass), out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i) ^ k();
    const txt = new TextDecoder().decode(out);
    if (txt.indexOf("SFFFL1|") !== 0) return null;      // wrong passphrase
    return JSON.parse(txt.slice(7));
  } catch (e) { return null; }
}

/* Seeded once, on a machine that has never run this file — which is the whole
   point of baking them in. `seeded` is what stops a target I deliberately
   cleared from coming back on the next reload. */
function seedTargets(pass) {
  if (ST.seeded) return 0;
  const list = unseal(TARGETSEED, pass);
  if (!list) return 0;
  ST.targets = ST.targets || {};
  let n = 0;
  list.forEach(nm => { if (BY[nm] && !ST.targets[nm]) { ST.targets[nm] = "t"; n++; } });
  ST.seeded = true;
  save(true);
  return n;
}
const PWHASH = "042602ee";

document.getElementById("flip").onclick = () => {
  const v = VIEW === "command" ? "broadcast" : "command";
  location.search = "?view=" + v;
};

/* The room screen hangs on the external monitor; this machine is driving
   Command. A control on Broadcast itself would mean reaching for the wrong
   keyboard mid-draft, so the flip is pushed from here over the state channel
   that already carries picks. Wired once: the bar is outside app.innerHTML. */
document.getElementById("roomflip").onclick = () => {
  clearRoomTimer();          // the hand overrides the clock, in both directions
  ST.face = ST.face === "pick" ? "board" : "pick";
  save(true);
  render();
};

buildShortNames();
load();
render();
computeOdds(render);
window.SFFFL = { commit, undo, onClock, state: () => ST, setView: v => { VIEW = v; render(); },
                 unlock: () => { unlocked = true; render(); }, load, taken, delta, bestAvail, render,
                 face: () => ST.face, setFace: v => { ST.face = v; save(true); render(); },
                 dwell: v => { if (v !== undefined) ROOM_DWELL = v; return ROOM_DWELL; },
                 armRoomTimer, clearRoomTimer, roomTimerPending: () => roomTimer !== null,
                 bigBoardHTML, tiersOf,
                 DATA, BY, KEPT, ST, triviaFor, marketSlot, shortName, urgencyOf, expectedBestAt, survivesTo, expectedBoard, moneyline, adopt, staleLog: () => stale, BUILD, lastCompleteRound, roundExtremes, recapFor, recapHTML, recapBlock, illegalReason, consensusAvail, buildTranscript, addCustom, draftable, pickFacts, systemPrompt, deepCut, sampleSequence, sampleRosters, applyTrades, parseTrade, tradeTrouble, commitTrade, undoTrade, tradeImbalance, tradeLine, countsWith, PICK_QUOTA, pickLabel, pickBoth, parsePickRef, RP, RPTO,
  setTradeDraft: (t, n) => { tradeDraft = t; tradeNote = n || ""; tradeArmed = false; },
  unseal, seedTargets, TARGETSEED, tonightBlock, roastTrigger, cliffAt, posGap, nightExtremes, wireFor, apiKey, setApiKey, projectedRosters, oneSeason, mulberry32, computeOdds,
                 odds: () => ODDS, ribbon: () => RIBBON };
