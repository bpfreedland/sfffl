/** A specific fact from the 24-year record, rotated so the same owner does not
    produce the same line twice in a night. These are the deep cuts. */
function deepCut(o, salt) {
  const l = (DATA.lore || {})[o] || {}, lg = (DATA.lore || {})._league || {};
  const c = [];
  if (l.titles && l.titles.length)
    c.push(o + " has won it in " + l.titles.join(", ") + ".");
  if (l.drought > 5) c.push(o + " has not won since " + (2025 - l.drought) + " — " + l.drought + " years.");
  if (l.drought === 0) c.push(o + " is the defending champion.");
  if (l.titles && !l.titles.length) c.push(o + " has never won this league. " + lg.seasons + " seasons.");
  if (l.runnerUp && l.runnerUp.length)
    c.push(o + " has lost the final " + l.runnerUp.length + " time" + (l.runnerUp.length > 1 ? "s" : "")
      + " (" + l.runnerUp.join(", ") + ").");
  if (l.coty && l.coty.length) c.push(o + " was coach of the year in " + l.coty.join(", ") + ".");
  if (l.money) c.push(o + " has taken " + l.money + " out of this league over " + l.cashes + " cashes.");
  if (l.owns) c.push(o + " owns " + l.owns[0] + " head to head, " + l.owns[1] + ".");
  if (l.ownedBy) c.push(l.ownedBy[0] + " owns " + o + " head to head, " + l.ownedBy[1] + ".");
  if (l.rec) c.push(o + " is " + l.rec + " all time.");
  c.push("Only one owner has ever gone back to back in "
    + lg.seasons + " seasons, and that was more than twenty years ago. "
    + lg.lastChamp + " is the current champion.");
  return c.length ? c[(seedOf(o + ":" + salt) >>> 5) % c.length] : "";
}


/** VERIFIED DRAFT TRIVIA.
    Seven years of real drafts, reconciled from ESPN recaps against Craig's own
    sheets. Each entry is a finished sentence with the count already computed;
    the model never sees the underlying table and is never asked to derive a
    number from draft history.

    Conditions on each fact (`c`) decide whether it may fire on THIS pick:
      own    the owner picking must be the fact's owner
      notown the owner picking must NOT be the fact's owner
      maxr   this pick must be within the owner's first N picks
      pos    this pick must be at this position
    The own/notown split exists because a count changes the instant the same
    owner takes the same player again. "Craig has drafted Tucker three times"
    becomes false at the moment Craig drafts him a fourth. */
function triviaFor(overall) {
  const T = (DATA.trivia || {}).facts || [];
  if (!T.length) return null;
  const pk = DATA.picks.find(x => x.o === overall);
  const nm = ST.made[overall], p = BY[nm];
  if (!pk || !p) return null;
  const mine = DATA.picks.filter(x => x.w === pk.w && ST.made[x.o])
    .map(x => x.o).sort((a, b) => a - b);
  const seq = mine.indexOf(overall) + 1;      // this owner's Nth pick tonight
  // A fact is spent once it has been spoken. Keyed by the pick that used it, so
  // Regenerate on the same pick still gets the same fact -- otherwise hitting
  // the button would silently change what the room is told. Owner-level money
  // facts made this necessary: there are only a handful per man and without it
  // Josh would hear about his $250 six times in one night.
  const used = ST.usedFact || {};
  const ok = T.filter((f, i) => {
    if (used[i] != null && used[i] !== overall) return false;
    if (f.p.length && f.p.indexOf(nm) < 0) return false;
    if (f.c.own && f.o.indexOf(pk.w) < 0) return false;
    if (f.c.notown && f.o.indexOf(pk.w) >= 0) return false;
    if (f.c.maxr && !(seq && seq <= f.c.maxr)) return false;
    if (f.c.pos && f.c.pos !== p.p) return false;
    if (!f.p.length && !f.o.length && !f.c.pos) return false;  // too generic
    return true;
  });
  if (!ok.length) return null;
  // player-specific beats owner-specific beats league-wide, then rotate
  const rank = f => (f.p.length ? 0 : f.o.length ? 1 : 2);
  ok.sort((a, b) => rank(a) - rank(b));
  const best = ok.filter(f => rank(f) === rank(ok[0]));
  const hit = best[(seedOf(nm + ":" + overall) >>> 3) % best.length];
  lastTrivia = { i: T.indexOf(hit), t: hit.t };
  return hit.t;
}
/** Set by the last triviaFor() call. pickFacts marks it spent; the tests, which
    call triviaFor directly to probe conditions, never do — so probing does not
    burn a fact. */
let lastTrivia = null;

/* ------------------------------------------------------------ TONIGHT
   Everything above this point is about the pick and the last 24 years. None of
   it knows what has happened in this room in the last hour, which is why the
   commentary could have been generated in any order. These functions read live
   state only: the pick log, the board, the odds ribbon.

   All of it is computed here, in code, and handed over as finished sentences —
   same contract as the trivia. The model is never asked to count anything. */

/** Picks since the last one at this position, and who made it. */
function posGap(overall, pos) {
  for (let o = overall - 1; o >= 1; o--) {
    const n = ST.made[o];
    if (n && BY[n] && BY[n].p === pos) {
      const pk = DATA.picks.find(x => x.o === o);
      return { gap: overall - o, at: o, w: pk ? pk.w : "", n: n };
    }
  }
  return null;
}

/** The night's extremes so far, INCLUDING this pick, so we can say a pick has
    just taken the title. Reaches are negative deltas, falls positive. */
function nightExtremes(overall) {
  let reach = null, fall = null;
  for (const pk of DATA.picks) {
    if (pk.o > overall) continue;
    const n = ST.made[pk.o]; if (!n || !BY[n]) continue;
    const d = delta(n, pk.o);
    if (!reach || d < reach.d) reach = { d: d, w: pk.w, n: n, o: pk.o };
    if (!fall || d > fall.d) fall = { d: d, w: pk.w, n: n, o: pk.o };
  }
  return { reach: reach, fall: fall };
}

/** Where the talent stops at a position. Returns how many are left at the
    current level and how far the drop is after them — the cliff, not a list. */
function cliffAt(pos) {
  const left = available().filter(p => p.p === pos).sort((a, b) => b.vor - a.vor);
  if (left.length < 2) return { left: left.length, drop: 0, last: left.length === 1 };
  let bi = 0, bg = 0;
  for (let i = 0; i < Math.min(left.length - 1, 8); i++) {
    const g = left[i].vor - left[i + 1].vor;
    if (g > bg) { bg = g; bi = i; }
  }
  return { left: bi + 1, drop: bg, total: left.length, last: false };
}

/** Who wanted this, and who is hurt by it being gone. */
function whoNeeded(pos, excludeOwner) {
  const out = [];
  for (const o of DATA.owners) {
    if (o === excludeOwner) continue;
    const nd = needLine(rosterFor(o));
    if (nd.short.some(s => s.endsWith(pos))) out.push(o);
  }
  return out;
}

/** Biggest mover in the title odds since the first pick of the night. */
function oddsLeader() {
  if (!RIBBON.length) return null;
  const start = RIBBON[0].odds || {};
  let up = null;
  DATA.owners.forEach(o => {
    const mv = (ODDS[o] || 0) - (start[o] || 0);
    if (!up || mv > up.mv) up = { w: o, mv: mv };
  });
  return up && up.mv >= 1.5 ? up : null;
}

/** The live half of the prompt: what this pick means to THIS draft, right now.
    Kept to a handful of lines — the cost of the whole block is a rounding error
    against 180 output tokens, but a wall of context makes the model list rather
    than choose. */
function tonightBlock(overall) {
  const nm = ST.made[overall], p = BY[nm];
  const pk = DATA.picks.find(x => x.o === overall);
  if (!p || !pk) return "";
  const L = [], d = delta(nm, overall);
  const done = Object.keys(ST.made).length;

  /* A pick made in a slot somebody else started the night holding is the most
     interesting thing that can happen at a draft table, and without this the
     commentary would call it an ordinary pick. Present tense, named owners, so
     it cannot be compressed into a claim about who owns what now. */
  const tr = (ST.trades || []).find(t => (t.moves || []).some(m => m.o === overall));
  if (tr) {
    const born = pk.w0;
    if (born && born !== pk.w)
      L.push(pk.w + " is picking here because he traded for this slot; it started "
        + "the night as " + born + "'s pick.");
    if (tr.note) L.push("The trade: " + tr.note + ".");
  }

  const ex = nightExtremes(overall);  if (ex.reach && ex.reach.o === overall && d <= -8 && done >= 6)
    L.push("That is the biggest reach of the draft so far.");
  else if (ex.fall && ex.fall.o === overall && d >= 8 && done >= 6)
    L.push("That is the furthest anyone has fallen tonight.");
  else if (ex.reach && d <= -8 && ex.reach.o !== overall)
    L.push("The biggest reach of the night is still " + ex.reach.w + " on "
      + ex.reach.n + ".");

  const g = posGap(overall, p.p);
  if (!g && done >= 8)
    L.push("That is the first " + p.p + " off the board tonight.");
  else if (g && g.gap >= 12)
    L.push("Nobody had taken a " + p.p + " in " + g.gap + " picks — the last was "
      + g.w + " on " + g.n + ".");
  else if (g && g.gap <= 3 && g.w !== pk.w)
    L.push(g.w + " took a " + p.p + " " + (g.gap === 1 ? "one pick" : g.gap + " picks")
      + " ago. It is going round the room.");

  const cf = cliffAt(p.p);
  if (cf.last) L.push("He was the last " + p.p + " on the board worth starting.");
  else if (cf.drop >= 12 && cf.left <= 3)
    L.push("Only " + (cf.left === 1 ? "one is" : cf.left + " are")
      + " left at that position before the board falls off a cliff.");

  const need = whoNeeded(p.p, pk.w);
  const nextUp = onClock();
  if (nextUp && need.indexOf(nextUp.w) >= 0)
    L.push(nextUp.w + " is next up and still needs a " + p.p + ".");
  else if (need.length >= 4 && ["RB", "WR", "TE"].indexOf(p.p) >= 0)
    L.push(need.length + " other rosters still need a " + p.p + ".");

  // tonight against the seven-year record
  const rec = (DATA.trivia || {}).records || {};
  const mine = DATA.picks.filter(x => x.w === pk.w && ST.made[x.o])
    .map(x => x.o).sort((a, b) => a - b);
  const seq = mine.indexOf(overall) + 1;
  if (p.p === "K" && rec.kMin && seq && seq < rec.kMin)
    L.push("No kicker has gone before an owner's " + rec.kMin + "th pick in this "
      + "league in " + rec.years + " years. That one went with his "
      + seq + (seq === 1 ? "st" : seq === 2 ? "nd" : seq === 3 ? "rd" : "th")
      + ". It is a first.");

  // what this owner has actually done tonight
  const mineNames = mine.map(o => ST.made[o]).filter(n => BY[n]);
  if (mineNames.length >= 3) {
    const seq2 = mineNames.map(n => BY[n].p);
    const tally = {};
    seq2.forEach(q => tally[q] = (tally[q] || 0) + 1);
    const top = Object.keys(tally).sort((a, b) => tally[b] - tally[a])[0];
    // a bare list of positions is not an observation. Only speak up when the
    // owner's night actually leans somewhere.
    if (tally[top] >= 3)
      L.push(pk.w + " has taken " + tally[top] + " " + top + "s tonight out of "
        + seq2.length + " picks.");
    else if (seq2.length >= 4 && new Set(seq2).size === seq2.length)
      L.push(pk.w + " has taken a different position with every pick tonight.");
  }

  const ld = oddsLeader();
  if (ld && done >= 20 && ld.w === pk.w)
    L.push(pk.w + " has gained more in the title picture tonight than anyone.");

  if (!L.length) return "";
  return "\nTONIGHT — live, from this draft, not from history. Use at most one of "
    + "these and make it the spine of the line if it is the most interesting "
    + "thing here:\n" + L.map(s => "- " + s).join("\n");
}

/** Does this pick contain a genuine, specific target? Roasts fire off this and
    nothing else. No trigger, no roast — which is what stops the model inventing
    a flaw on a perfectly sensible pick because the voice rules asked for edge. */
function roastTrigger(overall) {
  const nm = ST.made[overall], p = BY[nm];
  const pk = DATA.picks.find(x => x.o === overall);
  if (!p || !pk) return null;
  const d = delta(nm, overall);
  const r = rosterFor(pk.w), c = { QB:0, RB:0, WR:0, TE:0, K:0 };
  r.forEach(n => { if (BY[n]) c[BY[n].p]++; });
  const nd = needLine(r);
  const mine = DATA.picks.filter(x => x.w === pk.w && ST.made[x.o]).map(x => x.o);
  const seq = mine.sort((a, b) => a - b).indexOf(overall) + 1;
  const rec = (DATA.trivia || {}).records || {};

  if (p.p === "K" && rec.kMin && seq && seq < rec.kMin)
    return "a kicker taken earlier than any kicker in seven years of this league";
  if (p.p === "K" && c.K >= 2) return "a second kicker while the roster is still short";
  if (d <= -14) return "a reach of a size the room will notice";
  if (nd.spare < 0)
    return "a pick that leaves him unable to fill his required starters — "
      + "he still needs " + nd.short.join(", ") + " with " + nd.slots + " picks left";
  if (c[p.p] >= 5 && ["RB", "WR"].indexOf(p.p) >= 0 && nd.short.length)
    return "a fifth " + p.p + " on a roster that still needs " + nd.short.join(", ");
  if (positionRun(overall, p.p, 4) >= 3 && d <= -6)
    return "a reach made in a run, which is how reaches happen";
  return null;
}

/** Is this pick dull? Dull picks are where the trivia goes. */
function isRoutine(overall) {
  const nm = ST.made[overall], p = BY[nm];
  if (!p) return true;
  const d = Math.abs(delta(nm, overall));
  return d < 8 && positionRun(overall, p.p, 6) < 4 && p.p !== "K";
}

function pickFacts(overall) {
  const nm = ST.made[overall], p = BY[nm];
  if (!p) return null;
  const pk = DATA.picks.find(x => x.o === overall);
  const slot = marketSlot(p, overall), d = delta(nm, overall);
  const r = rosterFor(pk.w), c = { QB:0, RB:0, WR:0, TE:0, K:0 };
  r.forEach(n => { if (BY[n]) c[BY[n].p]++; });
  const short = POS.filter(q => c[q] < LIMIT[q][0]).map(q => (LIMIT[q][0] - c[q]) + " " + q);
  const run = positionRun(overall, p.p, 6);
  const prev = RIBBON.length > 1 ? RIBBON[RIBBON.length - 2].odds : null;
  const mv = prev ? (ODDS[pk.w] || 0) - (prev[pk.w] || 0) : 0;
  const L = [];
  L.push("PICK " + overall + " of 120, round " + pk.r + ". " + pk.w + " takes "
    + nm + ", " + p.p + ", " + p.t + ".");
  L.push("Projected " + p.pts.toFixed(0) + " points, " + p.vor.toFixed(0) + " over replacement.");
  if (p.p === "K") {
    // consensus ranks kickers for a yardage league; the comparison is noise here
    L.push("Kickers have no meaningful consensus position in this format. Judge "
      + "this one on WHEN in the draft it came, not on where the market had him.");
  } else {
    L.push("Market slot here was " + slot + ", so he went " + (d < 0 ? Math.abs(d)
      + (Math.abs(d) === 1 ? " pick" : " picks") + " EARLY (a reach)" : d > 0 ? d + (d === 1 ? " pick" : " picks") + " LATE (he fell)" : "right on schedule") + ".");
  }
  if (p.note) L.push("Scouting note: " + p.note);
  L.push(pk.w + "'s roster is now " + r.length + "/15 — "
    + POS.map(q => c[q] + " " + q).join(", ") + (short.length ? "; still needs " + short.join(", ") : "; minimums met") + ".");
  if (run >= 3) L.push("That is " + run + " " + p.p + "s in the last six picks.");
  const ks = Object.values(ST.made).filter(n => BY[n] && BY[n].p === "K").length;
  if (p.p === "K") L.push("Kicker number " + ks + " off the board, in round " + pk.r + ".");
  if (Math.abs(mv) >= 0.5) L.push("Title odds for " + pk.w + " moved "
    + (mv > 0 ? "+" : "") + mv.toFixed(1) + " points to " + (ODDS[pk.w] || 0).toFixed(1) + "%.");
  const nextUp = onClock();
  if (nextUp) L.push("On the clock next: " + nextUp.w + ".");

  // one deep cut per round minimum, and always on a dull pick
  ST.deep = ST.deep || {};
  const roundDone = !!ST.deep[pk.r];
  const late = (overall % 10) >= 8;
  const tn = tonightBlock(overall);
  if (tn) L.push(tn);

  const triv = triviaFor(overall);
  if (triv) {
    L.push("");
    L.push("THE RECORD — verified, from the commissioner's book and seven years "
      + "of real drafts. Use it as written. Do not adjust the numbers, do not "
      + "add to it, and do not infer anything else about past seasons: " + triv);
    if (lastTrivia) {
      ST.usedFact = ST.usedFact || {};
      ST.usedFact[lastTrivia.i] = overall;
    }
  }

  // Roasts are licensed by the facts, not by the mood. One per round at most.
  ST.roast = ST.roast || {};
  const trig = roastTrigger(overall);
  const spent = ST.roast[pk.r] != null && ST.roast[pk.r] !== overall;
  L.push("");
  if (trig && !spent) {
    L.push("ROAST LICENCE — this pick has a real target and you may go after it: "
      + trig + ". Go after the decision, hard, in one line. Not the man.");
    ST.roast[pk.r] = overall;
  } else {
    L.push("NO ROAST — there is nothing genuinely wrong with this pick. Do not "
      + "manufacture a flaw and do not sting the tail of the line. Be "
      + "interested in it instead.");
  }
  if (!roundDone && (isRoutine(overall) || late)) {
    L.push("");
    L.push((triv ? "ALSO from the record" : "FROM THE RECORD")
      + " — use this, it is the interesting part of this pick: "
      + deepCut(pk.w, pk.r));
    ST.deep[pk.r] = overall;
  } else if (isRoutine(overall) && !triv) {
    L.push("");
    L.push("This pick is unremarkable on its own. Something true and specific is "
      + "better than a forced verdict: " + deepCut(pk.w, overall));
  }
  return L.join("\n");
}

/** One sentence on a completed round. Same voice, same rules, tighter leash. */
function recapFacts(r) {
  const e = roundExtremes(r); if (!e) return null;
  const rows = DATA.picks.filter(x => x.r === r && ST.made[x.o])
    .map(x => x.w + " took " + ST.made[x.o] + " (" + (BY[ST.made[x.o]] || {}).p + ")");
  return ["ROUND " + r + " IS COMPLETE. All ten picks:",
    rows.join("; ") + ".",
    "By position: " + POS.filter(q => e.counts[q]).map(q => e.counts[q] + " " + q).join(", ") + ".",
    "Best value of the round: " + e.best.w + " on " + e.best.n + ".",
    "Worst: " + e.worst.w + " on " + e.worst.n + ".",
    "",
    "Write ONE sentence summarising the round. Not a list, not a recap of every",
    "pick — the single thing that characterised it. Same voice and same rules:",
    "no numbers from the board, third person, no addressing anyone."].join("\n");
}

async function runRecap(r) {
  if (VIEW !== "command" || ST.mute) return;
  if (ST.recap && ST.recap[r]) return;
  const facts = recapFacts(r); if (!facts) return;
  const key = apiKey(); if (!key) return;
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), WIRE_TIMEOUT);
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST", signal: ctl.signal,
      headers: { "content-type": "application/json", "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: MODEL, max_tokens: 120,
        system: [{ type: "text", text: systemPrompt(),
                   cache_control: { type: "ephemeral", ttl: "1h" } }],
        messages: [{ role: "user", content: facts }] })
    });
    clearTimeout(timer);
    if (!res.ok) return;
    const data = await res.json();
    const txt = (data.content || []).filter(b => b.type === "text")
      .map(b => b.text).join(" ").trim();
    if (txt) { ST.recap = ST.recap || {}; ST.recap[r] = txt; save(true); render(); }
  } catch (e) { clearTimeout(timer); }
}

/** Ask Sonnet. Resolves to a string, or null if anything at all goes wrong. */
async function askWire(overall) {
  const key = apiKey();
  if (!key) return null;
  const facts = pickFacts(overall);
  if (!facts) return null;
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), WIRE_TIMEOUT);
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      signal: ctl.signal,
      headers: {
        "content-type": "application/json",
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 180,
        system: [{ type: "text", text: systemPrompt(),
                   cache_control: { type: "ephemeral", ttl: "1h" } }],
        messages: [{ role: "user", content: facts }]
      })
    });
    clearTimeout(timer);
    if (!res.ok) { wireErr = "HTTP " + res.status; return null; }
    const data = await res.json();
    const txt = (data.content || []).filter(b => b.type === "text")
      .map(b => b.text).join(" ").trim();
    wireErr = "";
    return txt || null;
  } catch (e) {
    clearTimeout(timer);
    wireErr = e.name === "AbortError" ? "timed out" : "network error";
    return null;
  }
}

let wireErr = "";
let wireBusy = false;

/** Fetch commentary for a pick and put it in shared state so Broadcast sees it. */
/* The room screen returns to the board on its own once the insight has been
   read. The clock is anchored to the insight SETTLING, not to the pick landing:
   the wire call can take seconds or time out, and a timer started at commit can
   expire while the box is still empty, flipping away from a line nobody saw.

   Command owns the clock. Broadcast must never run one of its own -- both
   windows firing independent timers means two writers racing on ST.face, and the
   room screen flickers between faces with nobody touching anything. */
let ROOM_DWELL = 60000;
let roomTimer = null;
/* Bumped every time a human moves the face. runWire captures it before awaiting
   and the arm refuses if it changed underneath: the wire call is async, so an
   operator who commits a pick and immediately hits the button would otherwise
   clear a timer that has not been set yet, and the arm would land afterwards and
   flip the room screen a minute later with nobody having touched anything. */
let faceGen = 0;

function clearRoomTimer() {
  if (roomTimer) { clearTimeout(roomTimer); roomTimer = null; }
  faceGen++;
}

function armRoomTimer(overall, gen) {
  if (gen !== undefined && gen !== faceGen) return;   // a hand got here first
  clearRoomTimer();                        // a newer pick cancels the old clock
  faceGen--;                               // ...but this arm is not a hand
  if (VIEW !== "command") return;
  if (ST.face !== "pick") return;          // already on the board; nothing to do
  roomTimer = setTimeout(() => {
    roomTimer = null;
    if (ST.face !== "pick") return;        // the operator got there first
    if (lastPickSeen !== overall) return;  // a newer pick owns the screen now
    ST.face = "board";
    save(true);
    render();
  }, ROOM_DWELL);
}

async function runWire(overall, force) {
  if (VIEW !== "command") return;          // only the key holder calls out
  /* Muted and cached both mean the insight is already settled -- the written
     line is on screen this instant -- so the dwell starts now rather than never.
     Missing these is how a face gets stranded on the pick until someone notices. */
  const gen = faceGen;                     // captured before any await
  if (ST.mute) { armRoomTimer(overall, gen); return; }
  if (!force && ST.wire && ST.wire[overall]) { armRoomTimer(overall, gen); return; }
  wireBusy = true;
  ST.pending = overall;          // tells Broadcast that a second pass is coming
  save(true);
  render();
  const txt = await askWire(overall);
  wireBusy = false;
  if (ST.pending === overall) delete ST.pending;
  ST.wire = ST.wire || {};
  if (txt) ST.wire[overall] = txt;
  save(true);
  render();
  /* Settled either way: a live line arrived, or the call failed and the written
     fallback is what the room is reading. Both are done being read from. */
  armRoomTimer(overall, gen);
}

/** What Broadcast shows: the live line if it arrived, else the written one. */
function wireFor(overall) {
  if (ST.wire && ST.wire[overall]) return { text: ST.wire[overall], live: true };
  const c = commentary(overall);
  return c ? { text: c.line + (c.note ? " " + c.note : ""), live: false } : null;
}

async function testWire() {
  const el = document.getElementById("wiretest");
  if (el) el.textContent = "testing…";
  const key = apiKey();
  if (!key) { if (el) el.textContent = "no key saved"; return; }
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "content-type": "application/json", "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: MODEL, max_tokens: 16,
        messages: [{ role: "user", content: "Reply with the single word: ready" }] })
    });
    if (el) el.textContent = res.ok ? "connected — ready for draft night"
      : "failed: HTTP " + res.status + (res.status === 401 ? " (bad key)" : "");
  } catch (e) {
    if (el) el.textContent = "failed: could not reach the API";
  }
}


/* ---------------------------------------------------------------- entry */
let q = "", cursor = 0;
/* Trade entry is local to this window until it is committed. */
let tradeDraft = "", tradeNote = "", tradeArmed = false, tradeMsg = "";
function matches() {
  const s = q.trim().toLowerCase();
  if (!s) return [];
  const t = taken();
  const parts = s.split(/\s+/);
  return draftable().filter(p => {
    if (false) return false;
    const hay = (p.n + " " + p.t + " " + p.p).toLowerCase();
    return parts.every(x => hay.includes(x));
  }).sort((a,b) => a.adp - b.adp).slice(0, 8);
}
/** Players typed in on the night. Kept in shared state so both windows and a
    refresh all agree, and injected into the board so they behave like any
    other pick. */
function syncCustom() {
  const c = ST.custom || {};
  Object.keys(c).forEach(n => {
    if (BY[n]) return;
    const rec = { n: n, p: c[n].p, t: c[n].t || "FA", adp: 250,
                  pts: DATA.repl[c[n].p] || 0, vor: -1, thin: 1, custom: 1 };
    DATA.players.push(rec);
    BY[n] = rec;
    buildShortNames();
  });
}

function addCustom(name, pos, team) {
  name = String(name).trim();
  if (!name || BY[name]) return false;
  ST.custom = ST.custom || {};
  ST.custom[name] = { p: pos, t: (team || "FA").toUpperCase() };
  syncCustom();
  return true;
}

/** Why this owner cannot take this player, or "" if he can. */
function illegalReason(owner, name) {
  const p = BY[name]; if (!p) return "";
  const r = rosterFor(owner);
  if (r.length >= 15) return owner + " already has 15 players";
  const c = { QB:0, RB:0, WR:0, TE:0, K:0 };
  r.forEach(n => { if (BY[n]) c[BY[n].p]++; });
  if (c[p.p] >= LIMIT[p.p][1])
    return owner + " already has " + c[p.p] + " " + p.p + " (max " + LIMIT[p.p][1] + ")";
  if (!roomFor(r, p.p)) {
    const left = 15 - r.length - 1;
    const short = POS.filter(q => (c[q] + (q === p.p ? 1 : 0)) < LIMIT[q][0])
      .map(q => (LIMIT[q][0] - c[q] - (q === p.p ? 1 : 0)) + " " + q);
    return "that leaves " + owner + " short — still needs " + short.join(", ")
      + " with only " + left + " pick" + (left === 1 ? "" : "s") + " left";
  }
  return "";
}

let blockMsg = "";

function commit(name, force) {
  const pk = onClock();
  if (!pk || !name || taken().has(name)) return;
  if (!force) {
    const bad = illegalReason(pk.w, name);
    if (bad) { blockMsg = bad + "."; render(); return; }
  }
  blockMsg = "";
  ST.made[pk.o] = name;
  lastPickSeen = pk.o;
  /* The pick is the moment worth watching, so the room screen comes to it on its
     own; flipping back to the board is the manual half. The reverse default --
     staying put and reaching for the button on every pick -- is 120 presses. */
  ST.face = "pick";
  q = ""; cursor = 0;
  save(true);
  render();
  computeOdds(render);
  runWire(pk.o, false);
  const done = lastCompleteRound();
  if (done) runRecap(done);
}
function undo() {
  const done = Object.keys(ST.made).map(Number).sort((a,b) => a-b);
  if (!done.length) return;
  delete ST.made[done[done.length - 1]];
  ST.face = "board";     // the hero would otherwise describe a pick just erased
  clearRoomTimer();
  save(true);
  render();
}
function toggleTag(name, kind) {
  const cur = ST.targets[name];
  ST.targets[name] = (cur === kind) ? null : kind;
  if (!ST.targets[name]) delete ST.targets[name];
  save(true);
  render();
}

/* ---------------------------------------------------------------- render */
/* Board cells are narrow, so names get abbreviated — but "J. Williams" is both
   Javonte and Jameson, and "J. Love" is both Jeremiyah and Jordan. On a shared
   screen that is worse than a long name. Where an initial collides, keep enough
   of the first name to tell them apart. */
const SHORT = {};
function buildShortNames() {
  const byKey = {};
  DATA.players.forEach(p => {
    const parts = p.n.split(" ");
    if (parts.length < 2) { SHORT[p.n] = p.n; return; }
    const key = parts[0][0] + "|" + parts.slice(1).join(" ");
    (byKey[key] = byKey[key] || []).push(p.n);
  });
  Object.keys(byKey).forEach(key => {
    const group = byKey[key], last = key.split("|")[1];
    group.forEach(full => {
      const first = full.split(" ")[0];
      SHORT[full] = group.length === 1
        ? first[0] + ". " + last
        : first.slice(0, 4) + (first.length > 4 ? "." : "") + " " + last;
    });
  });
}
function shortName(full) {
  if (SHORT[full]) return SHORT[full];
  const parts = String(full).split(" ");
  return parts.length < 2 ? full : parts[0][0] + ". " + parts.slice(1).join(" ");
}
function posChip(p) {
  return '<span class="pos" style="background:var(--' + p + ')">' + p + '</span>';
}
function esc(s) { return String(s).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }

function gridHTML() {
  let h = '<table class="grid"><colgroup><col class="cRd">'
    + DATA.owners.map(() => "<col>").join("") + "</colgroup><tr><th></th>";
  DATA.owners.forEach(o => h += "<th>" + esc(o) + "</th>");
  h += "</tr>";
  const clock = onClock();
  for (let r = 1; r <= 12; r++) {
    h += '<tr><th class="rd">' + r + "</th>";
    DATA.owners.forEach(o => {
      /* Twelve picks have been traded, so an owner can hold two picks in one
         round and none in another. The old grid rendered a single pick per
         owner per round and silently dropped the rest — nine picks invisible,
         including Ben's own back-to-back at 19 and 20. */
      const cell = DATA.picks.filter(x => x.r === r && x.w === o);
      let cls = (o === DATA.me && VIEW === "command" ? "mine" : "");
      if (clock && cell.some(x => x.o === clock.o)) cls += " now";
      if (!cell.length) { h += '<td class="' + cls + ' empty2"></td>'; return; }
      const inner = cell.map(pk => {
        const nm = ST.made[pk.o];
        if (!nm) return '<div class="slot0"><span class="pn">#' + pk.o + "</span></div>";
        const p = BY[nm] || { p: "RB" };
        return '<div class="slotf p' + (p.p || "RB") + '">'
          + '<span class="nm">' + esc(shortName(nm)) + "</span>"
          + '<span class="pn">#' + pk.o + "</span>"
          + '<br><span class="sub">' + (p.p || "") + " \u00b7 " + (p.t || "") + "</span></div>";
      }).join("");
      h += '<td class="' + cls + (cell.length > 1 ? " twin" : "") + '">' + inner + "</td>";
    });
    h += "</tr>";
  }
  h += "</table>";
  // phone fallback: the last dozen picks as a list
  const done = Object.keys(ST.made).map(Number).sort((a, b) => b - a).slice(0, 12);
  h += '<ul class="recent">' + (done.length ? done.map(o => {
    const nm = ST.made[o], p = BY[nm] || {};
    return "<li>" + posChip(p.p || "RB") + '<span class="nm">' + esc(nm) + "</span>"
      + '<span class="who">' + esc(DATA.picks.find(x => x.o === o).w) + " · #" + o + "</span></li>";
  }).join("") : '<li><span class="sub">No picks yet.</span></li>') + "</ul>";
  return h;
}

/* Odds as a ranked list. The stacked ribbon looked good and said less than
   ten numbers do, so it went. Delta is against the reading before this pick,
   which is meaningful now that the sim uses common random numbers. */
/** Probability to an American moneyline, rounded the way a book would print it.
    Everyone here is under 50%, so every line is plus-money. Rounding matters:
    +425 reads as odds, +426 reads as a spreadsheet. */
function moneyline(pct) {
  const n = Object.keys(ST.made).length;
  const p = Math.max(pct / 100, 1 / (2 * SEASONS));   // never divide by zero
  if (p >= 0.5) {
    const v = 100 * p / (1 - p);
    return "-" + Math.round(v / 5) * 5;
  }
  const v = 100 * (1 - p) / p;
  const r = v < 400 ? Math.round(v / 5) * 5
          : v < 1000 ? Math.round(v / 25) * 25
          : v < 5000 ? Math.round(v / 100) * 100
          : v < 25000 ? Math.round(v / 500) * 500
          : 25000;
  return "+" + r;
}

function oddsListHTML() {
  const pc = Object.keys(ST.made).length;
  let prev = null;
  for (let i = RIBBON.length - 1; i >= 0; i--) {
    if (RIBBON[i].pick < pc) { prev = RIBBON[i].odds; break; }
  }
  const rows = DATA.owners.slice().sort((x, y) => ODDS[y] - ODDS[x]);
  let h = '<table class="odds">';
  rows.forEach((o, i) => {
    const v = ODDS[o] || 0;
    const dv = prev ? v - (prev[o] || 0) : 0;
    const arrow = !prev || Math.abs(dv) < 0.35 ? '<span class="flat">—</span>'
      : dv > 0 ? '<span class="up">&#9650; ' + dv.toFixed(1) + "</span>"
               : '<span class="dn">&#9660; ' + Math.abs(dv).toFixed(1) + "</span>";
    // no highlight on the shared screen — same reason the board lost it
    h += "<tr" + (o === DATA.me && VIEW === "command" ? ' class="me"' : "") + ">"
      + '<td class="rk">' + (i + 1) + "</td>"
      + "<td>" + esc(o) + "</td>"
      + '<td class="ml">' + moneyline(v) + "</td>"
      + '<td class="pcs">' + v.toFixed(1) + "%</td>"
      + '<td class="dl">' + arrow + "</td></tr>";
  });
  return h + "</table>";
}

/* Types the line out character by character. The text has already arrived in
   full — this is presentation, not streaming — but the draft is slow and a
   line that appears all at once reads as a caption, while one that types reads
   as something being written right now.

   The hard part is that render() fires often (every odds recompute), so the
   animation has to survive re-renders without restarting. State lives outside
   the render cycle and the loop writes to the node directly. */
const TYPE_MS = 16;
let typeState = { key: "", full: "", shown: "", timer: null, done: true };

function stopTyping() { if (typeState.timer) clearInterval(typeState.timer); typeState.timer = null; }

function startTyping(key, full) {
  if (typeState.key === key && typeState.full === full) return;   // already on it
  stopTyping();
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  typeState = { key: key, full: full, shown: reduce ? full : "", timer: null, done: reduce };
  if (reduce) return;
  typeState.timer = setInterval(() => {
    const step = 1 + (typeState.shown.length > 90 ? 1 : 0);   // ease up once rolling
    typeState.shown = full.slice(0, typeState.shown.length + step);
    const el = document.getElementById("saytext");
    if (el) el.textContent = typeState.shown;
    const car = document.getElementById("caret");
    if (typeState.shown.length >= full.length) {
      stopTyping(); typeState.done = true;
      if (car) car.style.display = "none";
    }
  }, TYPE_MS);
}

/** A pick graded against where the market had him, once keepers are removed. */
/* Kickers cannot be graded against consensus. Published ADP ranks them where a
   yardage league takes them, around slot 145 in a 220-man pool, while this
   league requires two on every roster inside 120 picks. Every kicker therefore
   grades F, on one pick in six. There is no correct letter, so there is no
   letter: the badge is dropped and the commentary is told why. */
function gradable(name) {
  const p = BY[name];
  return !!p && p.p !== "K";
}
function gradeOf(d) {
  if (d >= 25) return "A+";
  if (d >= 15) return "A";
  if (d >= 8) return "A-";
  if (d >= 3) return "B+";
  if (d >= -2) return "B";
  if (d >= -7) return "B-";
  if (d >= -14) return "C";
  if (d >= -24) return "D";
  return "F";
}

/** The last round where all ten picks are in. Zero until round one closes. */
function lastCompleteRound() {
  let best = 0;
  for (let r = 1; r <= 12; r++) {
    const picks = DATA.picks.filter(x => x.r === r);
    if (picks.length && picks.every(x => ST.made[x.o])) best = r;
  }
  return best;
}

/** Best and worst pick of a round, by how far each landed from the board. */
function roundExtremes(r) {
  const rows = DATA.picks.filter(x => x.r === r && ST.made[x.o]).map(x => {
    const nm = ST.made[x.o];
    return { o: x.o, w: x.w, n: nm, p: BY[nm], d: delta(nm, x.o) };
  }).filter(x => x.p);
  if (!rows.length) return null;
  const sorted = rows.slice().sort((a, b) => b.d - a.d);
  const counts = { QB:0, RB:0, WR:0, TE:0, K:0 };
  rows.forEach(x => counts[x.p.p]++);
  return { best: sorted[0], worst: sorted[sorted.length - 1], counts: counts, n: rows.length };
}

/** Written fallback if the API never answered for this round. */
function recapTemplate(r) {
  const e = roundExtremes(r); if (!e) return "";
  const led = POS.slice().sort((a, b) => e.counts[b] - e.counts[a])[0];
  const bits = POS.filter(q => e.counts[q]).map(q => e.counts[q] + " " + q);
  return "Round " + r + " went " + bits.join(", ") + ". "
    + (e.counts[led] >= 5 ? "A run on " + led + "s, and everyone saw it at once."
       : "No single position ran away with it.");
}

function recapFor(r) {
  if (ST.recap && ST.recap[r]) return { text: ST.recap[r], live: true };
  const t = recapTemplate(r);
  return t ? { text: t, live: false } : null;
}

function recapBlock(r, dim) {
  const e = roundExtremes(r); if (!e) return "";
  const rc = recapFor(r);
  const row = (label, x, cls) => '<div class="rcrow"><span class="rclab">'
    + label + '</span><span class="grade sm ' + cls + '">'
    + (gradable(x.n) ? gradeOf(x.d) : "K") + "</span>"
    + '<span class="rcname">' + esc(x.n) + '</span>'
    + '<span class="rcwho">' + esc(x.w) + "</span></div>";
  let h = '<div class="rcblock' + (dim ? " prior" : "") + '">'
    + '<div class="rchead">Round ' + r + "</div>"
    + row("BEST", e.best, "gA") + row("WORST", e.worst, "gF");
  if (rc) h += '<div class="rcsay' + (rc.live ? " ai" : "") + '">' + esc(rc.text) + "</div>";
  return h + "</div>";
}

/** The last two completed rounds. The older one is dimmed so the eye lands on
    the newer without the panel turning into a wall. */
function recapHTML() {
  const r = lastCompleteRound();
  if (!r) return '<div class="sub">Recaps start once round one is complete.</div>';
  return recapBlock(r, false) + (r > 1 ? recapBlock(r - 1, true) : "");
}

/* The consensus best-available strip. ONE definition, called from both faces.
   Duplicating this markup is the precise mechanism that put the big board into
   Broadcast once: an edit matched two copies of a line when only one of them was
   meant to change. Two copies also drift apart under later edits. */
function bestAvailHTML() {
  return '<div class="card"><h2>Best available \u00b7 consensus board</h2><div class="row">'
    + consensusAvail(16).map(p => '<span class="tag">' + posChip(p.p) + " "
      + esc(p.n) + "</span>").join("") + "</div></div>";
}

/* Who is on the clock, compressed to one line. The full hero card lives only on
   the pick face, but a remote owner watching the board face still has to know it
   is his turn -- being able to sit on the board between picks is the entire
   reason that face exists, and it is worthless if it hides the clock. */
function clockBarHTML() {
  const pk = onClock();
  return '<div class="card clockbar">'
    + (pk ? '<span class="clockname">' + esc(DATA.teamName[pk.w] || pk.w) + "</span>"
        + '<span class="cbmeta">on the clock \u00b7 round ' + pk.r
        + " \u00b7 pick " + pk.o + " of 120</span>"
      : '<span class="clockname">Draft complete</span>')
    + "</div>";
}

/* Broadcast is two faces and Command decides which one the room screen shows.
   The whole page never fit a Zoom share at a legible size: legibility is the
   fraction of the frame a glyph occupies, so zooming out to fit more content
   defeats itself. Showing less at a time is the only lever, and splitting the
   page trades time for space -- the only currency left once pixels are fixed.

   ST.face carries the choice. It rides in state rather than in its own channel
   message because the channel is the path that silently drops messages when a
   tab backgrounds, while resync() always reads state back out of localStorage.
   A face in state survives a reload and a dropped message for free. The cost is
   that a display toggle bumps ST.rev, so the revision counter now advances on
   events that are not picks. */
function broadcastView() {
  const done = Object.keys(ST.made).map(Number).sort((a, b) => a - b);
  const last = done.length ? done[done.length - 1] : null;
  const face = ST.face === "pick" ? "pick" : "board";
  let h = "";

  if (face === "board") {
    h += clockBarHTML();
    h += bestAvailHTML();
    /* NO big board here, on EITHER face. It carries my value-over-replacement
       ordering, survival percentages to my next pick, the leap flags and my
       target/avoid marks -- the whole private board. It reached this view once
       because the edit that added it to Command replaced both matches of the
       same line, and the board tests only ever looked at Command. Broadcast gets
       the consensus list and the pick grid, which is what the room already
       knows. There are now two faces to leak through and both are asserted. */
    h += '<div class="card"><h2>Board</h2>' + gridHTML() + "</div>";
    /* Trades are public: the room watched them happen and the grid already shows
       the new owner in the slot. This just says it in words. Nothing private is
       in here -- pick numbers, owner names, and a note I typed for the room. */
    h += tradeCardHTMLBcast();
    return h;
  }

  const pk = onClock();

  h += '<div class="hero">';
  if (last !== null) {
    const nm = ST.made[last], p = BY[nm] || {}, d = delta(nm, last);

    h += '<div class="card fade" id="hero"><h2>Pick ' + last + " · "
      + esc(DATA.picks.find(x => x.o === last).w) + "</h2>"
      + '<div class="name">' + esc(nm) + "</div>"
      + '<div class="meta">' + posChip(p.p || "RB")
      + "<span>" + esc(p.t || "") + "</span>"
      + (gradable(nm)
          ? '<span class="grade ' + (d >= 3 ? "gA" : d >= -2 ? "gB" : d >= -14 ? "gC" : "gF")
            + '">' + gradeOf(d) + "</span>"
          : "")
      + "</div></div>";
  } else {
    h += '<div class="card"><h2>Before the first pick</h2>'
      + '<div class="name">Keepers are in</div>'
      + '<div class="meta">Thirty players off the board. 120 picks to go.</div></div>';
  }
  h += '<div class="card"><h2>On the clock</h2>'
    + (pk ? '<div class="clockname">' + esc(DATA.teamName[pk.w] || pk.w) + "</div>"
        + '<div class="eyebrow" style="margin-top:8px">Round ' + pk.r
        + " · pick " + pk.o + " of 120</div>"
      : '<div class="clockname">Draft complete</div>');
  h += "</div></div>";

  h += '<div class="split">';
  h += '<div class="card"><h2>Championship odds'
    + (oddsBusy ? " · recomputing" : "") + "</h2>" + oddsListHTML()
    + '<div class="sub" style="margin-top:8px">' + SEASONS
    + " simulated seasons, recomputed every pick</div></div>";
  const lcr = lastCompleteRound();
  h += '<div class="card"><h2>Round recaps</h2>' + recapHTML() + "</div>";
  const cm = last === null ? null : commentary(last);
  const wr = last === null ? null : wireFor(last);
  const waiting = wr && !wr.live && ST.pending === last;
  h += '<div class="card"><h2 class="' + (wr && wr.live ? "hAI" : "hInstant") + '">'
    + (last === null ? "The wire" : wr && wr.live ? "AI insights" : "Instant analysis")
    + (waiting ? '<span class="incoming">AI insights incoming\u2026</span>' : "") + "</h2>"
    + (wr ? '<div class="say' + (wr.live ? " ai" : "") + '"><span id="saytext">'
        + esc(typeState.key === "w" + last && !typeState.done ? typeState.shown : wr.text)
        + '</span><span id="caret" class="caret"'
        + (typeState.key === "w" + last && !typeState.done ? "" : ' style="display:none"')
        + ">\u2588</span></div>"
      : '<div class="say">Keepers are set. Thirty players are already gone, '
        + "and the first pick of the draft is on the clock.</div>")
    + "</div>";
  h += "</div>";
  h += bestAvailHTML();
  return h;
}

/* --------------------------------------------------------- the big board

   The paper board on the wall, in software: one column per position plus an
   overall, ordered my way, crossed off as the room drafts. Command had a top
   twelve and a pick grid, neither of which answers the question you actually ask
   on the clock -- "if I take a back here, what is left at receiver when it comes
   back to me?" That needs the whole column, in order, with the dead names gone.

   Tiers, not ranks. A ranked list says Higgins is better than Adams; it does not
   say they are the same player and the drop is two names below. The dividers fall
   where the value gap between consecutive players is largest, so what you read off
   the column is how many are left at this level -- which is the number that
   decides whether you can wait. */

const BOARD_ROWS = 20;        // per position column
const BOARD_ROWS_OVR = 26;    // the overall column carries more
/* A tier break has to be a real drop, but "real" is not the same size at every
   position. Measured on the current board, the largest gap inside the top twenty
   is 7.1 at running back and 4.3 at receiver, and below about 1.5 the gaps are
   indistinguishable from rounding. A flat 4.0 gave running back a single divider
   across fifty-two players, which is a ranked list wearing a line. */
const TIER_MIN = 1.5;

/** Split a sorted column into tiers at the biggest value gaps. */
function tiersOf(list, want) {
  if (list.length < 3) return [list];
  const gaps = [];
  for (let i = 0; i < list.length - 1; i++)
    gaps.push([i, list[i].vor - list[i + 1].vor]);
  const cuts = gaps.filter(g => g[1] >= TIER_MIN)
    .sort((a, b) => b[1] - a[1]).slice(0, want || 4)
    .map(g => g[0]).sort((a, b) => a - b);
  const out = [];
  let from = 0;
  cuts.forEach(c => { out.push(list.slice(from, c + 1)); from = c + 1; });
  out.push(list.slice(from));
  return out.filter(t => t.length);
}

function boardRow(p, gone, nxt) {
  const tag = ST.targets[p.n];
  const leap = (p.leap || 0) >= LEAP_FLAG;
  let cls = "brow";
  if (gone) cls += " gone";
  if (tag === "t") cls += " tgtd";
  if (tag === "x") cls += " avoid";
  /* This slot used to carry survival-to-my-next-pick. It now carries
     Subvertadown's VAL. Survival is not gone from the tool -- it still has its
     own column on the on-clock card, which is where the question it answers
     ("can I wait?") is actually asked. */
  const sv = p.sv;
  return '<div class="' + cls + '">'
    + '<span class="bn">' + esc(shortName(p.n)) + "</span>"
    + '<span class="bt">' + esc(p.t || "") + "</span>"
    + '<span class="bb" title="Boone, on this draft\'s scale">'
    + (BSLOT[p.n] ? "B" + BSLOT[p.n] : "") + "</span>"
    + (leap && !gone ? '<span class="bleap" title="my number is carrying this">\u25B2</span>' : "")
    + '<span class="bv">' + (p.vor >= 0 ? "+" : "") + p.vor.toFixed(0) + "</span>"
    + (sv != null
        ? '<span class="bs" title="Subvertadown VAL, their rank ' + p.svr + '" '
          + 'style="color:' + (sv >= 0.5 ? "#3E8E6E" : sv >= 0 ? "#A98A4B" : "#B05A44")
          + '">' + sv.toFixed(1) + "</span>"
        : '<span class="bs dimtxt" title="not on the Subvertadown sheet">\u00b7</span>')
    + "</div>";
}

function boardColumn(label, list, limit, nxt, tiered) {
  const t = taken();
  const showGone = !!ST.showTaken;
  const live = list.filter(p => !t.has(p.n));
  const rows = showGone ? list.slice(0, limit + 8) : live.slice(0, limit);
  /* Tiers only within a position. Across the whole pool the ordering IS the
     tier, and the biggest gaps in a merged list fall wherever one position runs
     dry -- which drew a rule after row 24 of the overall column and told you
     nothing. */
  const shown = rows.filter(p => showGone || !t.has(p.n));
  const tiers = tiered ? tiersOf(shown, 4) : [shown];
  /* Urgency compresses a position to one number and hides its shape. "RB 8.4" is
     the same whether three backs remain before a 22-point drop or eleven sit on a
     gentle slope, and at 19 with 20 in hand those are opposite situations. The
     header carries the cliff; each rule carries the drop you take by crossing it. */
  let cliff = "";
  if (tiered) {
    const c = cliffAt(label);
    /* A cliff is only a cliff against the position's own slope. TIER_MIN is the
       threshold for drawing a rule, not for calling something a drop worth
       planning around -- at 1.5 every position has a "cliff" and the chip says
       nothing. Fire only when the gap stands well clear of the typical one. */
    const head = live.slice(0, 12), gaps = [];
    for (let i = 0; i < head.length - 1; i++) gaps.push(head[i].vor - head[i + 1].vor);
    const srt = gaps.slice().sort((a, b) => a - b);
    const med = srt.length ? srt[Math.floor(srt.length / 2)] : 0;
    const real = c && !c.last && c.drop >= Math.max(4, 3 * med);
    cliff = real
      ? '<span class="bcl" title="' + c.left + " left before the biggest drop "
        + "at this position, worth " + c.drop.toFixed(0) + ' points">'
        + c.left + " \u2192 \u2212" + c.drop.toFixed(0) + "</span>"
      : '<span class="bcl even" title="no drop worth planning around in the '
        + 'next few here \u2014 the slope is smooth">even</span>';
  }
  let h = '<div class="bcol"><div class="bhead">' + label + cliff
    + '<span class="bct">' + live.length + " left</span></div>";
  tiers.forEach((tier, i) => {
    h += '<div class="btier">';
    tier.forEach(p => h += boardRow(p, t.has(p.n), nxt));
    h += "</div>";
    if (i < tiers.length - 1) {
      const a = tier[tier.length - 1], b = (tiers[i + 1] || [])[0];
      const d = (a && b) ? a.vor - b.vor : 0;
      h += '<div class="brule">'
        + (d > 0 ? '<span class="brd">\u2212' + d.toFixed(0) + "</span>" : "")
        + "</div>";
    }
  });
  const more = live.length - rows.filter(p => !t.has(p.n)).length;
  if (more > 0) h += '<div class="bmore">+' + more + " more</div>";
  return h + "</div>";
}

/* Two orderings, and they are not interchangeable.

   VOR is mine, in this league's points, and it is what the tiers, the cliff
   chips and urgency are all computed from. VAL is Subvertadown's, from a sheet
   configured to this scoring. It is strictly non-increasing down their board and
   takes only 26 distinct values across 168 players -- it is their ranking
   coarsened, not a second measurement. So sorting by VAL means sorting by their
   board, and ties break on their rank rather than on mine, which is the only
   honest way to read a number that ranks rather than measures.

   Tier rules and cliff chips are suppressed under a VAL sort. They are gaps in
   VOR points and the thresholds that decide what counts as a cliff are in those
   units; drawing them against VAL's 0.1-wide steps would be inventing a drop. */
function sortKey() { return ST.boardSort === "val" ? "val" : "vor"; }
function sortPool(a) {
  if (sortKey() === "val")
    return a.slice().sort((x, y) =>
      (x.svr == null) - (y.svr == null) ||        // no sheet entry sinks
      (x.svr - y.svr) || (y.vor - x.vor));
  return a.slice().sort((x, y) => y.vor - x.vor);
}

function bigBoardHTML() {
  const nxt = myNextPick();
  const pool = DATA.players.filter(p => !p.thin && !KEPT.has(p.n));
  const byVal = sortKey() === "val";
  let h = '<div class="row" style="margin-bottom:8px;justify-content:space-between">'
    + '<span class="sub">'
    + (byVal ? "Ordered by Subvertadown. Their VAL ranks rather than measures \u2014 "
             + "it only moves in one direction down their board \u2014 so ties keep "
             + "their order, and tier rules are off because those are gaps in my "
             + "points, not theirs. "
             : "Ordered my way. Lines are tier breaks, marked with the drop you take "
             + "by crossing one. Each position header carries its cliff \u2014 how "
             + "many are left before the biggest drop there. ")
    + "The last column is Subvertadown's VAL; a dot means he is not on their sheet. "
    + "\u25B2 marks a pick only my projection likes.</span>"
    + '<span class="bsort">sort'
    + '<button id="srtvor" class="' + (byVal ? "" : "on") + '">+/\u2212 mine</button>'
    + '<button id="srtval" class="' + (byVal ? "on" : "") + '">VAL</button>'
    + "</span>"
    + '<button id="tgltaken">' + (ST.showTaken ? "Hide taken" : "Show taken")
    + "</button></div>";
  h += '<div class="bwrap">';
  h += boardColumn("Overall", sortPool(pool.filter(p => p.p !== "K")),
                   BOARD_ROWS_OVR, nxt, false);
  POS.forEach(q => {
    h += boardColumn(q, sortPool(pool.filter(p => p.p === q)), BOARD_ROWS, nxt, !byVal);
  });
  h += "</div>";
  return h;
}

/* ------------------------------------------------------- command panels */

/** Best legal starting eight. The flex is the wrinkle: minimums are
    2/4/4/2/2 = 14 against a 15-man roster, so exactly ONE position carries a
    spare — a 5th RB, a 5th WR or a 3rd TE, never two. */
function lineupOf(names) {
  const by = { QB:[], RB:[], WR:[], TE:[], K:[] };
  names.forEach(n => { const p = BY[n]; if (p) by[p.p].push(p); });
  POS.forEach(q => by[q].sort((a, b) => b.pts - a.pts));
  const take = { QB:1, RB:2, WR:2, TE:1, K:1 };
  const start = [], used = {};
  POS.forEach(q => {
    used[q] = 0;
    for (let i = 0; i < take[q]; i++) if (by[q][i]) { start.push([q, by[q][i]]); used[q]++; }
  });
  let flex = null;
  ["RB","WR","TE"].forEach(q => {
    const c = by[q][used[q]];
    if (c && (!flex || c.pts > flex[1].pts)) flex = ["FLEX", c];
  });
  if (flex) start.push(flex);
  const inLineup = new Set(start.map(x => x[1].n));
  const bench = names.map(n => BY[n]).filter(p => p && !inLineup.has(p.n))
    .sort((a, b) => b.vor - a.vor);
  return { start: start, bench: bench, flex: flex };
}

function rosterFor(o) {
  const r = (DATA.keepers[o] || []).slice();
  DATA.picks.forEach(pk => { if (pk.w === o && ST.made[pk.o]) r.push(ST.made[pk.o]); });
  return r;
}
/** Best available that this owner can legally take. */
function bestLegalFor(o, round) {
  const r = rosterFor(o);
  for (const p of available().sort((a, b) => b.vor - a.vor)) {
    if (p.p === "K" && round && round < 8) continue;   // nobody does this
    if (roomFor(r, p.p)) return p;
  }
  return null;
}

function myRoster() {
  const mine = (DATA.keepers[DATA.me] || []).slice();
  DATA.picks.forEach(pk => {
    if (pk.w === DATA.me && ST.made[pk.o]) mine.push(ST.made[pk.o]);
  });
  return mine;
}

function needLine(names) {
  const c = { QB:0, RB:0, WR:0, TE:0, K:0 };
  names.forEach(n => { const p = BY[n]; if (p) c[p.p]++; });
  const short = POS.filter(q => c[q] < LIMIT[q][0])
    .map(q => (LIMIT[q][0] - c[q]) + " " + q);
  const slots = 15 - names.length;
  const spare = slots - short.reduce((a, s) => a + parseInt(s, 10), 0);
  return { short: short, slots: slots, spare: spare, counts: c };
}

function rosterHTML() {
  const mine = myRoster(), lu = lineupOf(mine), nd = needLine(mine);
  let h = '<table class="lineup">';
  lu.start.forEach(([slot, p]) => {
    h += '<tr><td class="slot">' + slot + "</td><td>" + posChip(p.p) + " "
      + esc(p.n) + '</td><td class="pc">' + p.pts.toFixed(0) + "</td></tr>";
  });
  const need = { QB:1, RB:2, WR:2, TE:1, K:1 };
  POS.forEach(q => {
    const have = lu.start.filter(x => x[0] === q).length;
    for (let i = have; i < need[q]; i++)
      h += '<tr><td class="slot">' + q + '</td><td class="empty">— open —</td><td></td></tr>';
  });
  if (!lu.flex) h += '<tr><td class="slot">FLEX</td><td class="empty">— open —</td><td></td></tr>';
  h += "</table>";
  h += '<div class="sub" style="margin-top:10px">' + mine.length + " of 15 · "
    + (nd.short.length ? "still required: " + nd.short.join(", ")
       : "minimums met") + " · " + Math.max(0, nd.spare)
    + " free slot" + (nd.spare === 1 ? "" : "s") + "</div>";

    h += '<div class="sub" style="margin-top:8px">Bench: '
      + lu.bench.map(p => esc(p.n) + " (" + p.p + ")").join(", ") + "</div>";
  }
