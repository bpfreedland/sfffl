<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SFFFL Draft 2026</title>
<style>
/* Navy and antique gold — the league's own colours, same as the polos.
   Broadcast is a dark field meant to be read across a room on a shared screen;
   Command is light because it is a desk, not a show. */
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap');
:root{
  --navy:#16283C; --deep:#0C1826; --slate:#22384F;
  --gold:#A98A4B; --gold-lt:#D9BE84; --parch:#F2EDE1; --dim:#8195A8;
  --QB:#7C5CB0; --RB:#3E8E6E; --WR:#C4634A; --TE:#3E8EA8; --K:#C79A3A;
  --disp:"Barlow Condensed",'Haettenschweiler','Arial Narrow',sans-serif;
  --body:"Barlow",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 var(--body);background:var(--parch);color:var(--navy)}
body.bcast{background:var(--deep);color:var(--parch)}
.bar{display:flex;align-items:baseline;gap:14px;padding:9px 20px;
  background:var(--navy);color:var(--parch);border-bottom:2px solid var(--gold)}
.bar b{font:700 20px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase}
.bar .sp{margin-left:auto;font-size:12px;color:var(--dim)}
.flip{font:600 11px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;
  background:transparent;color:var(--gold-lt);border:1px solid var(--gold);
  padding:5px 10px;border-radius:4px;margin-left:auto}
#viewname{font:600 12px/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold-lt)}
.wrap{padding:16px 20px;max-width:1500px;margin:0 auto}
.card{background:#fff;border:1px solid #E0D9CB;border-radius:10px;padding:14px;margin-bottom:14px}
.bcast .card{background:var(--navy);border:1px solid var(--slate);border-radius:6px}
h2{font:600 11px/1 var(--disp);letter-spacing:.18em;text-transform:uppercase;
  color:var(--gold);margin:0 0 10px}
.bcast h2{color:var(--gold-lt)}
/* ---- hero: the pick that just landed ---- */
.hero{display:grid;grid-template-columns:1fr 300px;gap:14px}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.name{font:700 58px/.95 var(--disp);letter-spacing:-.005em;margin:2px 0 8px;
  text-transform:uppercase}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  font:500 15px/1 var(--body);color:var(--dim)}
.pos{font:700 12px/1 var(--disp);letter-spacing:.1em;color:#fff;padding:4px 8px;border-radius:3px}
.verdict{font:700 30px/1 var(--disp);letter-spacing:.03em}
.steal{color:#5FCB98}.reach{color:#E58B72}.market{color:var(--dim)}
.clockname{font:700 30px/1.05 var(--disp);text-transform:uppercase;color:var(--parch)}
.eyebrow{font:600 11px/1 var(--disp);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
/* ---- the ribbon ---- */
.ribwrap{position:relative}
svg.rib{width:100%;height:230px;display:block}
.riblab{font:600 12px/1 var(--body)}
.ribpct{font:700 15px/1 var(--disp)}
.baseline{stroke:var(--gold);stroke-width:1;stroke-dasharray:3 4;opacity:.55}
/* ---- board ---- */
.grid{width:100%;border-collapse:collapse;font-size:11.5px;table-layout:fixed}
.grid th{font:600 10px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);padding:6px 3px;border-bottom:1px solid var(--slate);text-align:left}
.card .grid th{border-bottom-color:#E0D9CB}
.grid td{border:1px solid #EFEAE0;padding:4px 4px;height:34px;vertical-align:top;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bcast .grid td{border-color:#1B3049}
.grid td.mine{background:#F4F7F4}
.bcast .grid td.mine{background:#16304A}
.grid td.now{outline:2px solid var(--gold);outline-offset:-2px}
.nm{font-weight:600}
.sub{color:var(--dim);font-size:10px}
/* ---- command ---- */
input[type=text]{width:100%;padding:12px 14px;font:500 17px var(--body);
  border:1px solid #E0D9CB;border-radius:8px;background:var(--parch);color:var(--navy)}
input:focus-visible,button:focus-visible,li:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{font:600 14px var(--body);padding:9px 15px;border:1px solid #E0D9CB;
  border-radius:8px;background:#fff;cursor:pointer;color:var(--navy)}
button.primary{background:var(--navy);color:var(--parch);border-color:var(--navy)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
ul.sug{list-style:none;margin:8px 0 0;padding:0;max-height:280px;overflow:auto}
ul.sug li{padding:9px 11px;border:1px solid #E0D9CB;border-radius:8px;margin-bottom:6px;
  cursor:pointer;display:flex;gap:9px;align-items:center}
ul.sug li.on{border-color:var(--navy);background:#EEF2F6}
.tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;
  border:1px solid #E0D9CB;color:var(--dim);margin:0 5px 5px 0}
.bcast .tag{border-color:var(--slate);color:var(--parch)}
.tag.tgt{border-color:var(--gold);color:#7A6231;background:#FBF6EA}
.tag.dnd{border-color:#B05A44;color:#B05A44;background:#FBF0EE}
.gate{max-width:340px;margin:70px auto;text-align:center}
.fade{animation:f .45s cubic-bezier(.2,.7,.3,1)}
@keyframes f{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(max-width:700px){
  .wrap{padding:12px}
  .name{font-size:34px}
  .verdict{font-size:22px}
  .clockname{font-size:22px}
  svg.rib{height:190px}
  .grid{display:none}
  .recent{display:block}
}
.recent{display:none;list-style:none;margin:0;padding:0}
.recent li{display:flex;gap:9px;align-items:center;padding:7px 0;
  border-bottom:1px solid var(--slate)}
.recent .who{margin-left:auto;font:600 11px/1 var(--disp);letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim)}
@media(prefers-reduced-motion:reduce){.fade{animation:none}
  svg.rib *{transition:none!important}}
</style>
</head>

/* ---------------------------------------------------------------- derived */
function taken() { return new Set(Object.values(ST.made)); }

  for (const pk of DATA.picks) if (!ST.made[pk.o]) return pk;
  return null;
}

  const out = [];
  DATA.picks.forEach(pk => { if (pk.w === o && ST.made[pk.o]) out.push(ST.made[pk.o]); });
  return out;
}

  const t = taken();
  return DATA.players.filter(p => !t.has(p.n));

  return available().sort((a,b) => b.pts - a.pts).slice(0, n);

/** market slot minus where he actually went. positive = fell = steal */

  const p = BY[name]; if (!p) return 0;
  return p.adp - overall;
}

/* ------------------------------------------------------------------ odds
   Championship probability, computed in the page. Same model as the Python
   prototype: weekly scoring is a compound Poisson on events, each player's
   season rate carries a gamma multiplier drawn once and held all year, byes
   and inactives drop him from the pool so the optimiser starts his backup.

   Runs in slices off a timer so the window never locks up while Ben types.  */
const TRUST = { QB: 0.80, RB: 0.78, WR: 0.80, TE: 0.75, K: 0.30 };
const AVAIL = 0.94;
const SEASONS = 400;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function pois(lam, rnd) {
  if (lam <= 0) return 0;
  let L = Math.exp(-lam), k = 0, u = rnd();
  while (u > L && k < 40) { u -= L; k++; L *= lam / k; }
  return k;
}
/* Marsaglia-Tsang; mean 1, shape k */
function gamma1(k, rnd) {
  if (k < 1) return gamma1(k + 1, rnd) * Math.pow(rnd(), 1 / k);
  const d = k - 1 / 3, c = 1 / Math.sqrt(9 * d);
  for (;;) {
    let x, v;
    do { 
      const u1 = rnd(), u2 = rnd();
      x = Math.sqrt(-2 * Math.log(u1 || 1e-9)) * Math.cos(2 * Math.PI * u2);
      v = 1 + c * x;
    } while (v <= 0);
    v = v * v * v;
    const u = rnd();
    if (u < 1 - 0.0331 * x * x * x * x) return d * v / k;
    if (Math.log(u) < 0.5 * x * x + d * (1 - v + Math.log(v))) return d * v / k;
  }
}
function eventsOf(p) {
  if (p.p === "K") return [[3, (p.fg || 0) / 17], [1, (p.xp || 0) / 17]];
  if (p.p === "QB") return [[3, (p.ptd || 0) / 17], [6, (p.rtd || 0) / 17]];
  return [[6, (p.td || 0) / 17]];
}

/** Every team's roster right now: keepers plus whatever they have drafted,
 *  with the rest of their picks filled by best available. A team is not three
 *  keepers, it is three keepers plus the picks it is going to make. */
function projectedRosters() {
  const rost = {}, t = new Set();
  DATA.owners.forEach(o => {
    rost[o] = (DATA.keepers[o] || []).slice();
    rost[o].forEach(n => t.add(n));
  });
  DATA.picks.forEach(pk => {
    const nm = ST.made[pk.o];
    if (nm && !t.has(nm)) { rost[pk.w].push(nm); t.add(nm); }
  });
  const pool = DATA.players.filter(p => !t.has(p.n)).sort((a, b) => b.pts - a.pts);
  DATA.picks.forEach(pk => {
    if (ST.made[pk.o]) return;
    if (rost[pk.w].length >= 15) return;
    for (const p of pool) {
      if (t.has(p.n)) continue;
      if (!roomFor(rost[pk.w], p.p)) continue;
      rost[pk.w].push(p.n); t.add(p.n); break;
    }
  });
  return rost;
}
const LIMIT = { QB: [2,2], K: [2,2], RB: [4,5], WR: [4,5], TE: [2,3] };
function roomFor(names, pos) {
  const c = { QB:0, RB:0, WR:0, TE:0, K:0 };
  names.forEach(n => { const p = BY[n]; if (p) c[p.p]++; });
  if (c[pos] >= LIMIT[pos][1]) return false;
  const left = 15 - names.length - 1;
  let need = 0;
  POS.forEach(q => need += Math.max(0, LIMIT[q][0] - (c[q] + (q === pos ? 1 : 0))));
  return need <= left;
}

function oneSeason(rost, rnd) {
  const rr = {};
  DATA.owners.forEach(o => {
    rr[o] = rost[o].map(n => {
      const p = BY[n]; if (!p) return null;
      const cv = 1 - TRUST[p.p], k = 1 / (cv * cv), m = gamma1(k, rnd);
      return { pos: p.p, team: p.t, ev: eventsOf(p).map(e => [e[0], e[1] * m]) };
    }).filter(Boolean);
  });
  const score = (o, wk) => {
    const by = { QB:[], RB:[], WR:[], TE:[], K:[] };
    for (const pl of rr[o]) {
      if (wk !== null && DATA.bye[pl.team] === wk + 1) continue;
      if (wk !== null && rnd() > AVAIL) continue;
      let s = 0;
      for (const e of pl.ev) s += e[0] * pois(e[1], rnd);
      by[pl.pos].push(s);
    }
    POS.forEach(q => by[q].sort((a, b) => b - a));
    let tot = 0;
    const used = { QB:1, RB:2, WR:2, TE:1, K:1 };
    for (const q of POS) for (let i = 0; i < used[q]; i++) tot += by[q][i] || 0;
    let flex = 0;
    ["RB","WR","TE"].forEach(q => {
      const extra = by[q][used[q]] || 0;
      if (extra > flex) flex = extra;
    });
    return tot + flex;
  };
  const wins = {}, pf = {};
  DATA.owners.forEach(o => { wins[o] = 0; pf[o] = 0; });
  for (let wk = 0; wk < 14; wk++) {
    const wkScore = {};
    DATA.owners.forEach(o => wkScore[o] = score(o, wk));
    for (const g of DATA.schedule[wk]) {
      const a = wkScore[g[0]], b = wkScore[g[1]];
      pf[g[0]] += a; pf[g[1]] += b;
      if (a > b) wins[g[0]]++; else if (b > a) wins[g[1]]++;
      else { wins[g[0]] += 0.5; wins[g[1]] += 0.5; }
    }
  }
  const order = DATA.owners.slice().sort((x, y) =>
    (wins[y] - wins[x]) || (pf[y] - pf[x]));
  const dw = {};
  order.forEach(o => { if (!dw[DATA.div[o]]) dw[DATA.div[o]] = o; });
  const seeds = Object.values(dw).sort((x, y) => order.indexOf(x) - order.indexOf(y));
  for (const o of order) if (seeds.length < 4 && seeds.indexOf(o) < 0) seeds.push(o);
  const play = (x, y) => {
    const a = score(x, null), b = score(y, null);
    return a === b ? (pf[x] > pf[y] ? x : y) : (a > b ? x : y);
  };
  return { champ: play(play(seeds[0], seeds[3]), play(seeds[1], seeds[2])),
           top: order[0] };
}

/* sliced runner ------------------------------------------------------- */
let ODDS = {}, oddsRun = 0, oddsBusy = false;
DATA.owners.forEach(o => ODDS[o] = 10);
let RIBBON = [];   // history: one snapshot per completed pick

function computeOdds(done) {
  const myRun = ++oddsRun;
  const rost = projectedRosters();
  const rnd = mulberry32(0x5FFF1 + Object.keys(ST.made).length);
  const tally = {}; DATA.owners.forEach(o => tally[o] = 0);
  let n = 0;
  oddsBusy = true;
  (function slice() {
    if (myRun !== oddsRun) return;            // a newer pick superseded this run
    const end = Math.min(n + 40, SEASONS);
    for (; n < end; n++) tally[oneSeason(rost, rnd).champ]++;
    if (n < SEASONS) return setTimeout(slice, 0);
    DATA.owners.forEach(o => ODDS[o] = 100 * tally[o] / SEASONS);
    oddsBusy = false;
    RIBBON.push({ pick: Object.keys(ST.made).length, odds: Object.assign({}, ODDS) });
    if (done) done();
  })();
}


/* ---------------------------------------------------------------- entry */
let q = "", cursor = 0;
function matches() {
  const s = q.trim().toLowerCase();
  if (!s) return [];
  const t = taken();
  const parts = s.split(/\s+/);
  return DATA.players.filter(p => {
    if (t.has(p.n)) return false;
    const hay = (p.n + " " + p.t + " " + p.p).toLowerCase();
    return parts.every(x => hay.includes(x));
  }).sort((a,b) => a.adp - b.adp).slice(0, 8);
}
function commit(name) {
  const pk = onClock();
  if (!pk || !name || taken().has(name)) return;
  ST.made[pk.o] = name;
  lastPickSeen = pk.o;
  q = ""; cursor = 0;
  save(true);
  render();
  computeOdds(render);
}
function undo() {
  const done = Object.keys(ST.made).map(Number).sort((a,b) => a-b);
  if (!done.length) return;
  delete ST.made[done[done.length - 1]];
  save(true);
  render();
}
function toggleTag(name, kind) {
  const cur = ST.targets[name];
  ST.targets[name] = (cur === kind) ? null : kind;
  if (!ST.targets[name]) delete ST.targets[name];
  save(true);
  render();
}

/* ---------------------------------------------------------------- render */
function posChip(p) {
  return '<span class="pos" style="background:var(--' + p + ')">' + p + '</span>';
}
function esc(s) { return String(s).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }

function gridHTML() {
  let h = '<table class="grid"><tr><th></th>';
  DATA.owners.forEach(o => h += "<th>" + esc(o) + "</th>");
  h += "</tr>";
  const clock = onClock();
  for (let r = 1; r <= 12; r++) {
    h += "<tr><th>" + r + "</th>";
    DATA.owners.forEach(o => {
      const pk = DATA.picks.find(x => x.r === r && x.w === o);
      if (!pk) { h += "<td></td>"; return; }
      const nm = ST.made[pk.o];
      let cls = (o === DATA.me ? "mine" : "");
      if (clock && pk.o === clock.o) cls += " now";
      if (!nm) { h += '<td class="' + cls + '"><span class="sub">' + "#" + pk.o + "</span></td>"; return; }
      const p = BY[nm] || { p: "RB" };
      h += '<td class="' + cls + '"><span class="nm">' + esc(nm) + "</span><br>"
        + '<span class="sub">' + p.p + " · " + (p.t || "") + "</span></td>";
    });
    h += "</tr>";
  }
  h += "</table>";
  // phone fallback: the last dozen picks as a list
  const done = Object.keys(ST.made).map(Number).sort((a, b) => b - a).slice(0, 12);
  h += '<ul class="recent">' + (done.length ? done.map(o => {
    const nm = ST.made[o], p = BY[nm] || {};
    return "<li>" + posChip(p.p || "RB") + '<span class="nm">' + esc(nm) + "</span>"
      + '<span class="who">' + esc(DATA.picks.find(x => x.o === o).w) + " · #" + o + "</span></li>";
  }).join("") : '<li><span class="sub">No picks yet.</span></li>') + "</ul>";
  return h;
}

/* Ten bands, one per team, stacked to fill the frame. Height is share of
   championship equity, so the ribbon always fills — this is a zero-sum race,
   and the shape shows who is taking from whom as the draft runs. Band order
   is fixed by draft slot so the bands never jump; the leader gets the gold
   edge. Before any picks the whole thing is a flat ten-way split, which is
   the honest starting picture. */
const BAND = ["#A98A4B","#3E8E6E","#C4634A","#3E8EA8","#7C5CB0",
              "#C79A3A","#4E7CA8","#8A9B5C","#B0705E","#5E6E86"];

function ribbonSVG() {
  const W = 1000, H = 230, PAD_R = 152, PAD_B = 22;
  const hist = RIBBON.length ? RIBBON : [{ pick: 0, odds: ODDS }];
  const pts = hist.length === 1 ? [hist[0], hist[0]] : hist;
  const xOf = i => (i / (pts.length - 1)) * (W - PAD_R);
  const stackAt = i => {
    const o = pts[i].odds;
    let tot = 0; DATA.owners.forEach(n => tot += (o[n] || 0));
    tot = tot || 1;
    let acc = 0;
    return DATA.owners.map(n => {
      const lo = acc; acc += 100 * (o[n] || 0) / tot;
      return [lo, acc];
    });
  };
  const cols = pts.map((_, i) => stackAt(i));
  const yOf = v => (H - PAD_B) * (v / 100);
  let out = '<svg class="rib" viewBox="0 0 ' + W + " " + H
    + '" preserveAspectRatio="none" role="img" aria-label="Championship odds by pick">';
  const last = cols[cols.length - 1];
  const lead = DATA.owners.reduce((m, o) => (ODDS[o] > (ODDS[m] || 0) ? o : m), DATA.owners[0]);
  DATA.owners.forEach((o, k) => {
    let top = "", bot = "";
    for (let i = 0; i < cols.length; i++) top += (i ? "L" : "M") + xOf(i).toFixed(1) + "," + yOf(cols[i][k][0]).toFixed(1);
    for (let i = cols.length - 1; i >= 0; i--) bot += "L" + xOf(i).toFixed(1) + "," + yOf(cols[i][k][1]).toFixed(1);
    out += '<path d="' + top + bot + 'Z" fill="' + BAND[k] + '" opacity="'
      + (o === lead ? ".95" : ".72") + '"/>';
    if (o === lead) out += '<path d="' + top + '" fill="none" stroke="#D9BE84" stroke-width="1.5"/>';
  });
  // the ten-way line: above it, keepers and picks have bought you something
  out += '<line class="baseline" x1="0" y1="' + yOf(10).toFixed(1)
    + '" x2="' + (W - PAD_R) + '" y2="' + yOf(10).toFixed(1) + '"/>';
  // right-edge labels, laid out in stack order so they never collide
  DATA.owners.forEach((o, k) => {
    const mid = (last[k][0] + last[k][1]) / 2;
    out += '<text class="riblab" x="' + (W - PAD_R + 12) + '" y="' + (yOf(mid) + 4).toFixed(1)
      + '" fill="' + (o === lead ? "#D9BE84" : "#C9D4DE") + '">' + esc(o) + "</text>";
    out += '<text class="ribpct" x="' + (W - 8) + '" y="' + (yOf(mid) + 4).toFixed(1)
      + '" text-anchor="end" fill="' + (o === lead ? "#D9BE84" : "#8195A8") + '">'
      + (ODDS[o] || 0).toFixed(1) + "</text>";
  });
  out += '<text class="riblab" x="0" y="' + (H - 6) + '" fill="#5E7186">pick '
    + (hist[0] ? hist[0].pick : 0) + "</text>";
  out += '<text class="riblab" x="' + (W - PAD_R) + '" y="' + (H - 6)
    + '" text-anchor="end" fill="#5E7186">pick ' + Object.keys(ST.made).length + "</text>";
  return out + "</svg>";
}

function broadcastView() {
  const pk = onClock();
  const done = Object.keys(ST.made).map(Number).sort((a, b) => a - b);
  const last = done.length ? done[done.length - 1] : null;
  let h = "";

  h += '<div class="hero">';
  if (last !== null) {
    const nm = ST.made[last], p = BY[nm] || {}, d = delta(nm, last);
    const v = d > 10 ? '<span class="verdict steal">FELL ' + d + " SPOTS</span>"
      : d < -10 ? '<span class="verdict reach">REACHED ' + (-d) + "</span>"
      : '<span class="verdict market">AT MARKET</span>';
    h += '<div class="card fade" id="hero"><h2>Pick ' + last + " · "
      + esc(DATA.picks.find(x => x.o === last).w) + "</h2>"
      + '<div class="name">' + esc(nm) + "</div>"
      + '<div class="meta">' + posChip(p.p || "RB")
      + "<span>" + esc(p.t || "") + "</span>"
      + "<span>market slot " + (p.adp || "—") + "</span>" + v + "</div></div>";
  } else {
    h += '<div class="card"><h2>Before the first pick</h2>'
      + '<div class="name">Keepers are in</div>'
      + '<div class="meta">Thirty players off the board. 120 picks to go.</div></div>';
  }
  h += '<div class="card"><h2>On the clock</h2>'
    + (pk ? '<div class="clockname">' + esc(DATA.teamName[pk.w] || pk.w) + "</div>"
        + '<div class="eyebrow" style="margin-top:8px">Round ' + pk.r
        + " · pick " + pk.o + " of 120</div>"
      : '<div class="clockname">Draft complete</div>');
  h += "</div></div>";

  h += '<div class="card ribwrap"><h2>Championship odds · '
    + (oddsBusy ? "recomputing" : SEASONS + " simulated seasons per pick")
    + "</h2>" + ribbonSVG() + "</div>";

  h += '<div class="card"><h2>Best available</h2><div class="row">'
    + bestAvail(7).map(p => '<span class="tag">' + posChip(p.p) + " "
      + esc(p.n) + "</span>").join("") + "</div></div>";
  h += '<div class="card"><h2>Board</h2>' + gridHTML() + "</div>";
  return h;
}

function commandView() {
  const pk = onClock();
  const m = matches();
  let h = '<div class="card"><h2>' + (pk ? "Pick " + pk.o + " · " + esc(pk.w)
    + " · round " + pk.r : "Draft complete") + "</h2>";
  h += '<input type="text" id="q" placeholder="Type a player…" '
    + 'autocomplete="off" value="' + esc(q) + '">';
  h += '<ul class="sug">' + m.map((p, i) =>
    '<li class="' + (i === cursor ? "on" : "") + '" data-n="' + esc(p.n) + '">'
    + posChip(p.p) + '<span class="nm">' + esc(p.n) + "</span>"
    + '<span class="sub">' + (p.t || "") + " · ADP " + p.adp + "</span>"
    + (ST.targets[p.n] === "t" ? '<span class="tag tgt">TARGET</span>' : "")
    + (ST.targets[p.n] === "x" ? '<span class="tag dnd">DO NOT</span>' : "")
    + "</li>").join("") + "</ul>";
  h += '<div class="row" style="margin-top:10px">'
    + '<button class="primary" id="go">Enter pick</button>'
    + '<button id="undo">Undo last</button>'
    + '<button id="sim10">Auto-pick 10</button>'
    + '<button id="reset">Clear draft</button></div>'
    + '<div class="sub" style="margin-top:8px">Auto-pick fills with best available '
    + 'so you can watch the ribbon move without typing. Clear wipes everything.</div>'
    + "</div>";

  h += '<div class="card"><h2>My targets</h2><div class="row">';
  const tg = Object.keys(ST.targets);
  h += tg.length ? tg.map(n => '<span class="tag '
    + (ST.targets[n] === "t" ? "tgt" : "dnd") + '" data-tag="' + esc(n) + '">'
    + esc(n) + (taken().has(n) ? " ✕" : "") + "</span>").join("")
    : '<span class="sub">none yet — press T or X on a search result</span>';
  h += "</div></div>";

  h += '<div class="card"><h2>Board</h2>' + gridHTML() + "</div>";
  return h;
}

function render() {
  document.getElementById("viewname").textContent =
    VIEW === "command" ? "Command" : "Broadcast";
  const app = document.getElementById("app");
  if (VIEW === "command" && !unlocked) {
    app.innerHTML = '<div class="gate card"><h2>Command board</h2>'
      + '<input type="text" id="pw" placeholder="passphrase">'
      + '<div class="row" style="margin-top:10px;justify-content:center">'
      + '<button class="primary" id="unlock">Unlock</button></div></div>';
    document.getElementById("unlock").onclick = () => {
      if (fnv(document.getElementById("pw").value) === PWHASH) {
        unlocked = true; render();
      }
    };
    return;
  }
  document.body.className = VIEW === "command" ? "" : "bcast";
  app.innerHTML = VIEW === "command" ? commandView() : broadcastView();
  if (VIEW === "command") wireCommand();
}

function wireCommand() {
  const inp = document.getElementById("q");
  if (inp) {
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
    inp.oninput = e => { q = e.target.value; cursor = 0; render(); };
    inp.onkeydown = e => {
      const m = matches();
      if (e.key === "ArrowDown") { cursor = Math.min(cursor + 1, m.length - 1); render(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { cursor = Math.max(cursor - 1, 0); render(); e.preventDefault(); }
      else if (e.key === "Enter" && m[cursor]) { commit(m[cursor].n); e.preventDefault(); }
      else if ((e.key === "t" || e.key === "T") && e.ctrlKey && m[cursor]) { toggleTag(m[cursor].n, "t"); e.preventDefault(); }
      else if ((e.key === "x" || e.key === "X") && e.ctrlKey && m[cursor]) { toggleTag(m[cursor].n, "x"); e.preventDefault(); }
    };
  }
  const go = document.getElementById("go");
  if (go) go.onclick = () => { const m = matches(); if (m[cursor]) commit(m[cursor].n); };
  const u = document.getElementById("undo");
  if (u) u.onclick = undo;
  const s10 = document.getElementById("sim10");
  if (s10) s10.onclick = () => {
    for (let i = 0; i < 10; i++) {
      const pk = onClock(); if (!pk) break;
      const p = bestAvail(1)[0]; if (!p) break;
      ST.made[pk.o] = p.n;
    }
    save(true); render(); computeOdds(render);
  };
  const rs = document.getElementById("reset");
  if (rs) rs.onclick = () => {
    if (!confirm("Clear every pick? This cannot be undone.")) return;
    ST = { made: {}, targets: ST.targets, note: {} };
    RIBBON = [];
    save(true); render(); computeOdds(render);
  };
  document.querySelectorAll("ul.sug li").forEach((li, i) => {
    li.onclick = () => { cursor = i; render(); };
    li.ondblclick = () => commit(li.dataset.n);
  });
}

/* FNV-1a, same gate as the mock tool */
function fnv(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
  }
  return h.toString(16).padStart(8, "0");
}
const PWHASH = "7d0b279a";

document.getElementById("flip").onclick = () => {
  const v = VIEW === "command" ? "broadcast" : "command";
  location.search = "?view=" + v;
};

load();
render();
computeOdds(render);
window.SFFFL = { commit, undo, onClock, state: () => ST, setView: v => { VIEW = v; render(); },
                 unlock: () => { unlocked = true; render(); }, load, taken, delta, bestAvail,
                 DATA, projectedRosters, oneSeason, mulberry32, computeOdds,
                 odds: () => ODDS, ribbon: () => RIBBON };
</script>
</body>
