@import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
.sf,.sf *{box-sizing:border-box}
.sf{font-family:'EB Garamond','Century Schoolbook',Georgia,serif;font-size:16px;color:${p.ink};background:${p.paper};min-height:100vh;padding-bottom:40px}
.sf h1,.sf h2,.sf h3,.sf .disp{font-family:'Libre Baskerville','Century Schoolbook',Georgia,serif;font-weight:700;letter-spacing:.01em;text-transform:none;margin:0;line-height:1.15}
.sf .disp{font-variant:small-caps}
.sf .num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.sf button{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;letter-spacing:.01em;cursor:pointer;border:1px solid ${p.line};background:${p.paper2};color:${p.ink};border-radius:2px;padding:8px 12px;font-size:12px}
.sf button:hover:not(:disabled){background:#fff}
.sf button:disabled{opacity:.32;cursor:not-allowed}
.sf button:focus-visible{outline:2px solid ${p.amber};outline-offset:2px}
.sf .card{background:${p.paper2};border:1px solid ${p.line};border-radius:3px}
.sf input,.sf select{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;font-size:15px;border:1px solid ${p.line};background:${p.paper2};color:${p.ink};border-radius:2px;padding:7px 9px;font-size:13px}
.sf .row:hover{background:#FDFBF4}
.sf .sc{overflow:auto}
.sf .sc::-webkit-scrollbar{height:9px;width:9px}
.sf .sc::-webkit-scrollbar-thumb{background:${p.line};border-radius:5px}
.sf .eyebrow{font-family:'Libre Baskerville',Georgia,serif;font-variant:small-caps;text-transform:none;letter-spacing:.08em;font-size:11.5px;color:${p.mute}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sf .fade{animation:rise .7s cubic-bezier(.2,.7,.3,1) both}
@keyframes pop{from{opacity:0;transform:translateY(-7px);background:#f6e6bd}to{opacity:1;transform:none}}
.sf .pop{animation:pop .32s ease-out both}
.sf .fade.d1{animation-delay:.28s}
.sf .fade.d2{animation-delay:.52s}

/* --------------------------- square mode --------------------------- */
.sf.mag{background:#F2F3F1}
.sf.mag h1,.sf.mag h2,.sf.mag h3,.sf.mag .disp,.sf.mag .eyebrow{
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-variant:normal;letter-spacing:0}
.sf.mag .card{border-radius:0;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.sf.mag .eyebrow{text-transform:uppercase;font-size:10.5px;letter-spacing:.06em}

/* --------------------------- expert mode --------------------------- */
.sf.exp{background:#F6F8F6}
.sf.exp .card{border-color:#A8BFB1}
.sf.exp .eyebrow{color:#3F6B54}

/* ------------------------------ DMode ------------------------------ */
.sf.dyl{background:#F7F5F9}
.sf.dyl .card{border-color:#BCAECB}
.sf.dyl .eyebrow{color:#5A3E75}

/* ---------------------------- drunk mode ---------------------------- */
.sf.bar{background:
  repeating-linear-gradient(90deg,#3a2612 0 38px,#331f0f 38px 40px,#442d15 40px 78px,#2b1c0d 78px 80px);
  color:#f0dcae}
.sf.bar::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,194,51,.16),transparent 62%)}
.sf.bar > *{position:relative;z-index:1}
.sf.bar h1,.sf.bar h2,.sf.bar h3{color:#ffd766!important;
  text-shadow:0 0 6px #ff9c1a,0 0 18px #ff6a00,0 0 34px rgba(255,80,0,.6)}
.sf.bar .card{background:rgba(43,28,13,.94);border:2px solid #7a5423;
  box-shadow:0 3px 0 rgba(0,0,0,.45),inset 0 0 22px rgba(0,0,0,.5);
  transform:rotate(var(--tilt,0deg))}
.sf.bar .card:nth-of-type(3n){--tilt:.35deg}
.sf.bar .card:nth-of-type(3n+1){--tilt:-.3deg}
.sf.bar .card:nth-of-type(4n){--tilt:.6deg}
.sf.bar .eyebrow{color:#7ee8a6!important;text-shadow:0 0 5px #24d16a,0 0 14px rgba(36,209,106,.6)}
.sf.bar button{background:#4a3116;color:#ffd766;border:2px solid #8a6029;
  text-shadow:0 0 4px rgba(255,154,26,.8)}
.sf.bar button:hover:not(:disabled){background:#5d3d1b}
.sf.bar input,.sf.bar select,.sf.bar textarea{background:#241708;color:#f0dcae;border-color:#7a5423}
.sf.bar .row{border-color:#5a3d1c!important}
.sf.bar .row:hover{background:#43290f}
.sf.bar table th{background:#160e04!important}
.sf.bar .num{color:inherit}
.neon{animation:buzz 5s infinite}
@keyframes buzz{0%,96%,100%{opacity:1}97%{opacity:.35}98%{opacity:1}99%{opacity:.5}}
.tapper{display:inline-block;animation:tap 2.6s ease-in-out infinite}
@keyframes tap{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@media (prefers-reduced-motion:reduce){.sf *{transition:none!important;animation:none!important}}
