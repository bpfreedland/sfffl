@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
.sf,.sf *{box-sizing:border-box}
.sf{font-family:'IBM Plex Sans',system-ui,sans-serif;color:${c.ink};background:${c.paper};min-height:100vh;padding-bottom:40px}
.sf h1,.sf h2,.sf h3,.sf .disp{font-family:'Oswald',Impact,sans-serif;font-weight:600;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1.1}
.sf .num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.sf button{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;border:1px solid ${c.line};background:${c.paper2};color:${c.ink};border-radius:2px;padding:8px 12px;font-size:12px}
.sf button:hover:not(:disabled){background:#fff}
.sf button:disabled{opacity:.32;cursor:not-allowed}
.sf button:focus-visible{outline:2px solid ${c.amber};outline-offset:2px}
.sf .card{background:${c.paper2};border:1px solid ${c.line};border-radius:3px}
.sf input,.sf select{font-family:'IBM Plex Sans',sans-serif;border:1px solid ${c.line};background:${c.paper2};color:${c.ink};border-radius:2px;padding:7px 9px;font-size:13px}
.sf .row:hover{background:#fffdf7}
.sf .sc{overflow:auto}
.sf .sc::-webkit-scrollbar{height:9px;width:9px}
.sf .sc::-webkit-scrollbar-thumb{background:${c.line};border-radius:5px}
.sf .eyebrow{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.16em;font-size:10px;color:${c.mute}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sf .fade{animation:rise .7s cubic-bezier(.2,.7,.3,1) both}
@keyframes pop{from{opacity:0;transform:translateY(-7px);background:#f6e6bd}to{opacity:1;transform:none}}
.sf .pop{animation:pop .32s ease-out both}
.sf .fade.d1{animation-delay:.28s}
